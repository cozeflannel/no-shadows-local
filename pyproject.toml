[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slrr-campaigns"
version = "1.0.0"
description = "SLRR Brandwatch deep dives and alert campaigns Cloud Run service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "PyYAML>=6.0.1",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "deptry>=0.20.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "shellcheck-py>=0.11.0",
    "types-PyYAML>=6.0.12",
    "vulture>=2.13",
]

[tool.setuptools.packages.find]
include = ["slrr_campaigns*", "triage_agent*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "B",
    "ERA",
    "ARG",
    "T20",
    "BLE",
    "PIE",
    "SIM",
    "RET",
    "UP",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.cloud.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "triage_agent.*",
    "google.oauth2.*",
    "google.auth.*",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.deptry]
known_first_party = ["slrr_campaigns", "triage_agent", "scripts"]
extend_exclude = [
    "^\\.venv",
    "^\\.local",
    "^analytics",
    "^apps-script-chat-bot",
    "^apps-script-sheet-sidepanel",
    "^archive",
    "^console",
    "^data",
    "^docs",
    "^evals",
    "^flows",
    "^infra",
    "^jobs",
    "^knowledge_docs",
    "^mcp",
    "^studio-addon",
    "^triage_agent",
    "^tests/_console_fixtures",
    "^tests/a2_fixtures\\.py$",
    "^tests/conftest\\.py$",
    "^tests/test_",
    "^scripts/__init__\\.py$",
    "^scripts/build_apps_script\\.py$",
    "^scripts/mine_burson_history\\.py$",
    "^scripts/simulate\\.py$",
    "^scripts/sync_live_bigquery\\.py$",
    "^scripts/try_real_alerts\\.py$",
]

[tool.deptry.package_module_name_map]
PyYAML = "yaml"
google-api-python-client = "googleapiclient"
google-auth = "google"
google-auth-oauthlib = "google_auth_oauthlib"
google-cloud-bigquery = "google"
google-cloud-firestore = "google"
google-cloud-secret-manager = "google"
google-genai = "google"
