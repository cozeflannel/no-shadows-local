# =============================================================================
# SLRR Alert Automation Agent: production configuration
# -----------------------------------------------------------------------------
# Effective config = this file + config/distribution.yaml (+ config/channel_owners.json),
# deep-merged with overrides saved in the Agent Console.
# Source docs: SLRR Updated Collection Requirements (Mar 5 2026), Incident
# Manager guide, T&S Intake Form guide, Sonar overview, SLRR Alert Assistant v3.3.0.
# =============================================================================

version: "2026-10-13.2"
env: dev
timezone: America/New_York
case_id_prefix: TRG
escalation_id_prefix: ESC

agent:
  display_name: Triage Agent
  email: ""
  message_prefix: "🤖"

spaces:
  - {key: burson, display_name: "[S-F] Burson Automated Alerts V3", space_id: spaces/AAQAaa_0I9g, url: "https://chat.google.com/room/AAQAaa_0I9g"}
  - {key: clean, display_name: "SLRR Triaged Alerts", space_id: spaces/AAQAaLn375E, url: "https://chat.google.com/room/AAQAaLn375E"}
  - {key: youtube, display_name: "[S-F] YouTube Social", space_id: spaces/AAAAmUvgYGU, url: "https://chat.google.com/room/AAAAmUvgYGU"}
  - {key: doodle, display_name: "Doodle Team"}
  - {key: team, display_name: "24/7 SL (SLPO/SLRR) Team", space_id: spaces/AAAAEoKjb2g, url: "https://chat.google.com/app/chat/AAAAEoKjb2g"}
  - {key: crisis, display_name: "\"this is fine\" crisis chat"}

analysts: []

shifts:   # 4-shift follow-the-sun coverage
  - {name: APAC, start: "18:00", end: "00:00", tz: America/New_York}
  - {name: EMEA, start: "00:00", end: "06:00", tz: America/New_York}
  - {name: AMER early, start: "06:00", end: "12:00", tz: America/New_York}
  - {name: AMER late, start: "12:00", end: "18:00", tz: America/New_York}

models:   # Gemini 2.5 retires 2026-10-20; Gemini 3.x is served from the global endpoint only (404 in us-central1)
  triage: gemini-3.8-flash
  drafting: gemini-3.8-flash
  converse: gemini-3.8-flash
  location: global
  temperature_triage: 0.1
  temperature_drafting: 0.4

thresholds:
  needs_review_below: 0.70
  llm_block_min_confidence: 0.80
  llm_checks_enabled: true
  url_check_enabled: false
  url_check_timeout_s: 4.0
  max_correction_wait_min: 240
  sla_warn_fraction: 0.6
  review_reminder_min: 10

corrections:
  mode: auto                     # auto-apply high-confidence corrections; IM can revert (👎)
  auto_apply_min_confidence: 0.85
  never_auto_correct: [post_url]

burson_feedback:                 # legacy Studio path only (V1 uses burson_qa below)
  mode: digest                   # corrections go to Burson as a daily digest, not real-time requests
  digest_hour_local: 9
  recipients: []
  post_digest_to_burson_space: false
  silent_in_burson_space: true   # Stealth mode: Burson receives zero messages in [S-F] Burson Automated Alerts V3

# V1 Burson QA bot (Apps Script poller in apps-script-chat-bot/). After editing, regenerate its data file:
#   .venv/bin/python -m scripts.build_apps_script
# Bot ON/OFF and the Burson + analyst spaces are set on the Control tab of the bot's Google Sheet, not here.
burson_qa:
  react: true                    # legend emojis on Burson's posts: 👍 once reviewed · ⬇️ "addressed on updated post below"
  mirror_analyst_reactions: true # legend emojis analysts add on the forwarded copy are added to Burson's post too
  never_mirror: [agent_wrong]    # legend codes Burson never sees
  corrections_footer: true       # analysts see one line listing what the bot corrected
  dry_run: false                 # true = post nothing in the Burson space ("would reply" notes go under the forward)
  llm_min_confidence: 0.9        # Gemini suggestions below this are "double-check" notes for analysts, not fix requests
  llm_fix_severities: [blocking, warning]  # Gemini checks that can become fix requests: tag, product, topics + KOF, issue name, summary
  autocorrect_min_confidence: 0.6  # the Auto-correct space (B10) only: Gemini's value (and its existing-issue call) is applied from this (the agentic assistant decides; below it Burson's value stays), never on the summary or a field the rules decided
  autocorrect_writeup: true      # the Auto-correct space (B10) only: the review call also writes the alert's summary paragraph (web background only with web sources), for the corrected alert, its note and the Social Alert email
  check_issue_status: true       # Burson's "New" -> "Ongoing Issue" when the same issue was alerted in the last 14 days
  pending_fix_hours: 48          # an alert for the same post within 48 h of a fix request is Burson's fix
  start_lookback_minutes: 15
  overlap_minutes: 5
  max_messages_per_run: 100
  max_attempts: 3
  silent_fields: [alert_name, ts, code, other_products]   # corrected for analysts, never requested from Burson
  web_grounding: enterprise      # Gemini searches the web when reviewing alerts / answering analysts: enterprise (Vertex AI Web Grounding for Enterprise) | google | off
  follow_ups: true               # same post alerted again, or the author following up on an alert that went out: ❌ unless it adds something (then an update on that thread)
  follow_up_min_confidence: 0.8  # Gemini's "adds nothing new" must be at least this sure
  post_lookup: true              # look up the post itself (X, Bluesky, TikTok, Instagram, YouTube): its words, thread, quote, video and photos for Gemini
  media_bucket: brand-social-central-data-slrr-automations  # videos over 15 MB (up to 50 MB) are copied here for Gemini, then deleted; "" = never
  kof_no_alert: true             # Gemini may ❌ a KOF-only alert when it's 90%+ sure and a no-alert check holds and is backed up (an earlier alert that went out, or the leads' guidance)
  kof_no_alert_judgment: false   # true = Gemini's own "mistake" / "not actionable" reading alone may ❌ a KOF alert too (off: it disagreed with the IMs on 8 of 15 in May-June)
  guidance_from_email: true      # Gemini also reads the SLRR leads' recent emails about alerts (plus the sheet's Guidance tab)
  guidance_email_days: 7
  speed_tab: true                # the Results tab: how fast the bot sent each Social Alert vs the IMs, matched on the post's link (every 10 min)
  speed_days: 7                  # the summary covers the alerts of the last N days
  speed_im_table: brand-social-central-data.slrr_feedback.alert_sends   # the IMs' Social Alert drafts (SLRR Assistant)
  speed_log_table: brand-social-central-data.slrr_alerts.slrr_alerts    # the IMs' actioned alerts (backs up their call)
  speed_im_sender: ""                                                   # resolved dynamically from Brand safety groups when configured
  speed_gmail: true              # look up when the IMs' emails went out (in the mailbox the bot runs as)
  # Rollback settings: each guards one behaviour, so it can be turned off here (then rebuild and clasp push) without
  # reverting code. false, or 0 for a number, keeps what the bot did before. Outside the Auto-correct flow none of them
  # changes what the bot posts, queues or emails.
  early_detection_first: true    # the one-space setup: Early Detection runs before the Direct BigQuery poll (false: the poll first, as before)
  early_wave_reviews_per_hour: 6 # the Auto-correct flow: ordinary story signals queued for review in a clock hour (0: the old rule, 40 queued a day)
  early_wave_reviews_per_day: 150  # ...and story signals queued a day at most (used only while the hourly rule is on; 0: the old rule too)
  early_wave_topic_min_ratio: 3  # the Auto-correct flow: a topic's pace jump under this multiple of its usual count is noted, not reviewed (0: reviewed, as before)
  early_detection_tab: true      # the "Early Detection" tab: every story signal and what happened to it (false: no tab is made or written)
  # cross_alert_notes, the Auto-correct flow: a note under another alert's card when two alert types meet on one post or
  # story (story, watch and Direct BigQuery notes; the watch's "Same story" reply goes under its alert's card as such a
  # note), and a bigger post (2,000+ engagements) on an issue already alerted gets its own card (false: as before: no
  # such notes, the same-story reply goes in the thread as it used to, a post or story already covered is skipped and
  # counted, and no extra card for a bigger post)
  cross_alert_notes: true
  # requirement_line, the Auto-correct flow: the "Alert requirements" line in the note after each review, and the BSIP
  # card's [KOF] line from the feed's influencer list ("Yes (<list>)"), which can start a Social Alert at any size; while
  # it is on, an "Alert requirements: ...?" question asked under a card from the account the bot runs as is not taken
  # for one of the bot's notes (false: as before: no such line, the BSIP card's [KOF] line says No)
  requirement_line: true
  # New sources in Early Detection (Control rows 48-49, each OFF until the owner turns it on): how their posts share the
  # check with today's sources. None of these does anything while those rows are OFF.
  early_wave_new_embed_per_check: 100   # of the 400 texts embedded a check, the new sources' share (today's sources keep 300; room either side leaves goes to the other)
  early_wave_new_embed_per_day: 5000    # texts of the new sources embedded a UTC day at most (they also stop once the day's total nears its pace, keeping room for Sonar)
  early_wave_new_late_minutes: 180      # a new source's post first seen more than this long after it was posted can only join a story, never start one
  early_wave_new_pool_max: 300          # of the 1,200 unjoined posts kept to start stories, at most this many from the new sources...
  early_wave_new_pool_minutes: 120      # ...each kept this long at most
  early_wave_new_carry_max: 100         # new sources' posts not embedded in a check, kept for the next check (2 hours at most)
  early_wave_new_trial_days: 0          # no trial: stories only a new source lifts go for review from its first day, within the two limits below; above 0, the days after a source is first read when stories only it lifts over the bar are listed, not sent for review, and stories only it lifts to the early watch are not asked about
  early_wave_new_lifted_per_hour: 2     # after the trial: stories only the new sources lift over the bar, sent for review in an hour at most...
  early_wave_new_lifted_per_day: 20     # ...and in a day (the rest are listed, not sent)
  # The AMIE table in Early Detection (Control row 48, OFF until the owner turns it on): Brandwatch's alert feeds, X with
  # its words, read from BigQuery (no Brandwatch call). None of these does anything while row 48 is OFF.
  amie_rows_per_check: 300              # new rows of the AMIE table read a check at most (about a check's share of 25,000 a day)
  amie_overlap_minutes: 60              # each read starts this long before the newest row it last took, to catch rows that land late
  amie_max_gb: 1                        # one read may scan this many gigabytes at most (checked by a dry run each day); more: not read that day
  amie_stale_hours: 3                   # no new row in the table for this many hours is said in the row's note (the read goes on)
  amie_staff_feeds_rx: 'kof|kol|\binfs?\b|exec|googler|reps|posts by google'  # alert feeds of Google's staff and KOFs: their posts and authors are left out
  # Brandwatch read live for Early Detection (Control row 49, OFF until the owner turns it on): new mentions, never X,
  # from the queries ticked Read = ON on the New sources tab. None of these does anything while row 49 is OFF.
  bw_live_project_id: 1998344909        # the Brandwatch project read ("[SLRR] Private", the bot's project)
  bw_live_sources: [reddit, bluesky, facebook, facebook_public, instagram, instagram_public, tiktok, youtube, threads, tumblr, forum]  # the sources asked for (X and LinkedIn are refused whatever this says)
  bw_live_queries_max: 20               # ticked queries read at most (the first by row); one call reads them all
  bw_live_page_size: 300                # mentions a page
  bw_live_parcel_max: 300               # mentions handed to Early Detection a read at most
  bw_live_every_minutes: 10             # the least time between two reads
  bw_live_first_minutes: 30             # the first read after the row goes ON reads this far back (no backfill)
  bw_live_calls_per_10min: 20           # this reader's own calls in any 10 minutes at most (Brandwatch allows the shared login 600)
  bw_live_pause_at_used: 450            # no read for 10 minutes once the shared login has used this many of its 600 calls in 10 minutes
  bw_live_source_type_new: true         # ask for new mentions only (backfilled ones left out)
  # Step 3a of the new sources: while Control row 50 (the Watch's AMIE source) is ON, every post a carded Early
  # Detection story links is seen by that card in the alert memory, as its main post is, so the Watch and the Direct
  # BigQuery poll treat it as they treat the main post. With row 50 OFF nothing changes.
  early_detection_claim_members: true
  # The open engine (Control row 51, OpenEngine.gs; step S2 of the open-engine plan). The record of run time and
  # outside calls (RUN_LEDGER) runs with row 51 OFF too: it only records.
  open_daily_stop: 2000                 # background reviews an Eastern day at most (Burson's alerts never count or stop); also 10x quick looks, 100x Watch post checks, 1.5 GB x BigQuery
  open_runtime_budget_hours:            # the account's trigger run time a day; blank: 6 on a Workspace account, 1.5 on any other (the bot reads which, once a day)
  open_runtime_other_hours: 1.5         # what other scripts on the account use, plus a margin (at most half the budget)
  open_lock_loss_seconds: 2             # what a run that found the lock taken costs
  open_fetch_day:                       # outside calls a day; blank: 100,000 on a Workspace account, 20,000 on any other
  open_burson_pickup_p90_s: 120         # past this p90 of Burson's pick-up time, background work gives up 30 s more a run
  open_queue_max: 24                    # the review queue under row 51 (step S5); a story that does not fit waits for a later check
  # What the Resources tab of the bot's sheet starts with. After that the tab is what the bot uses: edit it there.
  # The bot links these when Burson asks about the alert requirements, so only list documents Burson can open.
  resources:
    - name: SLRR Collection Requirements
      url: "https://docs.google.com/document/d/1jHM7bVBNPw0hMN7bxVd4IivBjhVfTmNF33U4WknZN5s/edit"
      covers: "The alert requirements: every alert field and its format, exposure tags and their priority (P0/P1/P2), Sensitive Topics, product names, engagement levels, KOF, issue status, social network"
    - name: KOF lists
      url: "https://docs.google.com/spreadsheets/d/1b54g1c6R8Y2j1xnVQavmLJQZn04qgPfgyeTzBdFt_1k/edit"
      covers: "Who counts as a KOF (Key Opinion Former) and which KOF list they're on"

sonar_lookup:   # ground truth from Sonar data in bsip-s-bsip-gg-26-2cf3.google_bg (us-central1) + brand-social-central-data (US)
  enabled: true
  project: brand-social-central-data
  table: bsip-s-bsip-gg-26-2cf3.google_bg.sonar_raw
  alert_log_table: ""
  slrr_table: brand-social-central-data.slrr_alerts.slrr_alerts
  location: us-central1
  lookback_days: 7

inhouse:        # Path B: in-house alerts from brand-social-central-data.slrr_alerts / bsip-s-bsip-gg-26-2cf3.google_bg
  enabled: true
  project: brand-social-central-data
  outbox_view: brand-social-central-data.DSD.DSD-story-selection
  alert_log_table: brand-social-central-data.slrr_alerts.slrr_alerts
  sonar_table: bsip-s-bsip-gg-26-2cf3.google_bg.sonar_raw
  location: US
  sonar_location: us-central1
  mark_delivered: false
  parity_mode: true
  max_rows_per_run: 200

# Posts that don't come from a Studio run (jobs, Console, email follow-ups) are queued and
# delivered by the Studio "Outbox" flow. Studio's schedule starter only repeats daily/weekly,
# so the agent rings a doorbell to start that flow in real time.
outbox:
  doorbell: none
  sheet_id: null
  sheet_tab: outbox
  email_subject: "[triage-agent outbox]"
  clean_items_per_drain: 1
  max_items_per_target: 10

handover:
  enabled: true
  post_to_team: true
  append_to_doc: true
  minutes_after_shift_end: 5

metrics:
  burson_retrigger_minutes: 30   # "it takes our agency partner 30 minutes to alert viral KOFs (median)"
  im_minutes_per_alert: 10

# -----------------------------------------------------------------------------
# Incoming alert template: [S-F] Burson Automated Alerts V3 (Confirmed from
# production Burson Zapier messages + SLRR Alert Assistant v3.3.0)
# -----------------------------------------------------------------------------
alert_template:
  id: burson_sonar_alert_v3
  name: Burson Automated Alerts V3
  is_placeholder: false
  separator: ":"
  detection:
    sender_names: [Zapier, Burson, Sonar]
    sender_emails: []
    text_regex: "(?im)^\\s*(?:[\\*\\[]*(?:alert name|name|exposure tag)[\\*\\]]*\\s*:|(?:[⬛🟨🟧🟥⭐]\\s*)?SOCIAL ALERT)"
    min_labels_matched: 4
  flag_patterns:
    meets_p0: "(?i)this alert meets p0 criteria"
  record_key_fields: [post_url]
  clean_post_fields:
    [alert_name, engagement_level, total_engagement, product, other_products, social_network,
     exposure_tag, risk_tags, kof, ts, author, post_date, location, video_timestamp, post_url, code]
  fields:
    - {name: alert_name, labels: [Alert Name, Name, Alert, Title], type: string, required: true, min_length: 5, correctable: true,
       description: "Name of alert including product and whether it's a new or known issue, e.g. [Name]: <Issue> / Ongoing Issue"}
    - {name: issue_name, labels: [Issue Name, Issue], type: string, correctable: true,
       description: "Descriptive, neutral issue name."}
    - {name: issue_status, labels: [Issue Status, Status, Novelty], type: enum,
       allowed: [NEW, Ongoing Issue, Recently Reported, "New / not previously reported over the past 14 days"], correctable: true,
       description: "Alerted within 14 days = Ongoing Issue; otherwise NEW / New / not previously reported over the past 14 days."}
    - {name: engagement_level, labels: [Engagement Level, Engagement], type: enum, allowed: [VERY LOW, LOW, MODERATE, HIGH, VIRAL KOF], correctable: true, numeric_fallback: total_engagement}
    - {name: total_engagement, labels: [Total Engagement, Engagements, Engagement Count], type: integer, min: 0, correctable: true,
       description: likes + comments + shares}
    - {name: likes, labels: [Likes], type: integer, min: 0}
    - {name: comments, labels: [Comments, Replies], type: integer, min: 0}
    - {name: shares, labels: [Shares, Reposts, Retweets], type: integer, min: 0}
    - {name: views, labels: [Views], type: integer, min: 0}
    # "Product(s)" is the label on Burson's live alerts. The bare plurals (Products, Google Products) are left out on
    # purpose: a line of a post's summary that starts "Google products: ..." (a boycott list) would be read as the product.
    - {name: product, labels: [Product, Google Product, "Product(s)", "Google Product(s)"], type: string, required: true, reference_list: products, correctable: true,
       description: "Google product (distro name), e.g. Gemini App, AI Overviews, Pixel.",
       fix_hint: Use the product names from the distribution list (Gems -> Gemini App; AI Studio/Antigravity -> Devs Products).}
    - {name: other_products, labels: [Other Products, Other Google Products, "Product #2", "Product #3", Product 2, Additional Products], type: list, correctable: true}
    - {name: social_network, labels: [Social Network, Platform, Network], type: enum, required: true, correctable: true,
       allowed: [X, Reddit, Bluesky, Threads, TikTok, Instagram, Facebook, YouTube, LinkedIn, Truth Social, Gab, Rumble, Podcast, News, Other]}
    - {name: exposure_tag, labels: [Exposure Tag, Tag], type: string, required: true, reference_list: exposure_tags, correctable: true,
       description: One P0/P1/P2 brand-safety exposure tag (single tag per alert).}
    - {name: priority, labels: [Priority], type: enum, allowed: [P0, P1, P2], correctable: true}
    - {name: risk_tags, labels: [Risk Tag, Risk Tags, Sensitive Topic, Sensitive Topics, Sensitivity Topics], type: list, reference_list: sensitive_topics, correctable: true}
    - {name: kof, labels: [KOF, Key Opinion Former, P0 KOF], type: boolean, correctable: true}
    - {name: kof_lists, labels: [KOF Lists, KOF List, Influencer Lists], type: list}
    - {name: ts, labels: ["T&S", Trust & Safety, "T&S Recommended", "T&S Submitted"], type: boolean, correctable: true}
    - {name: author, labels: [Author, Handle, Account, Posted By], type: string, required: true}
    - {name: followers, labels: [Followers, Follower Count], type: integer, min: 0}
    - {name: post_date, labels: [Post Date, Published, Post Time, Posted, "Time/Date Post Went Live", "Time/Date Post Went Live (EST)", "Time/Date Post Went Live (EDT)"], type: datetime, not_in_future: true, max_age_days: 30}
    - {name: post_url, labels: [View Post, Post URL, URL, Link, Post Link], type: url, required: true,
       fix_hint: Paste the direct post permalink.}
    - {name: post_content, labels: [Post Content, Post, Content, Post Text, Text], type: text}
    - {name: summary, labels: [Summary, Sonar Summary, AI Summary], type: text, correctable: true}
    - {name: location, labels: [Location, Market, Country, Region], type: string}
    - {name: video_timestamp, labels: [Timestamp, Video Timestamp], type: string, correctable: true}
    - {name: code, labels: [Code], type: string}
  cross_field_rules:
    - {id: engagement_sum, kind: sum_equals, target: total_engagement, fields: [likes, comments, shares], tolerance: 0, severity: blocking,
       description: Total engagement must equal likes + comments + shares., fix: Recalculate Total Engagement.}
    - {id: url_matches_network, kind: url_domain_matches, url_field: post_url, key_field: social_network, domain_map: platform_domains, severity: blocking,
       description: The post URL must be on the stated network's domain., fix: Correct the Social Network (or the link).}
    - {id: video_needs_timestamp, kind: require_if, when: {social_network: YouTube}, require: [video_timestamp], severity: warning,
       description: Long videos need a timestamp for the Google mention., fix: Add the timestamp of the Google mention.}
  llm_checks:
    - {id: exposure_tag_fit, correctable_field: exposure_tag, severity: blocking, fields: [exposure_tag, post_content, summary, alert_name],
       instruction: "The Exposure Tag must be the single best tag from the taxonomy (P0 > P1 > P2 when several apply; use context clues for product failures / Google mistakes). Propose the correct tag if not."}
    - {id: product_fit, correctable_field: product, severity: blocking, fields: [product, other_products, post_content, summary, alert_name],
       instruction: "The Product (together with other_products when multiple Google products apply) must be the Google product(s) the post is about, using distribution names (Gems -> Gemini App; AI Studio / Antigravity -> Devs Products; Central AI -> Gemini Model, Gemini App, DeepMind, Devs Products or Brand). When other_products already lists the additional product(s) involved, mark ok=true as long as product + other_products accurately cover the post."}
    - {id: sensitive_topics_fit, correctable_field: risk_tags, severity: blocking, fields: [risk_tags, post_content, summary, location],
       instruction: "Risk Tags must list the Sensitive Topics that apply (Politics only for US/unknown location or English election content)."}
    - {id: kof_fit, correctable_field: kof, severity: warning, fields: [kof, author, followers, kof_lists],
       instruction: "KOF comes from Burson's KOF and influencer lists (the alert names them, e.g. 'Viral KOFs (KOFs)' or 'CAM Tech/AI (INFs)'); a listed author is a KOF whatever the engagement or follower count. Mark it wrong only when the alert says No for an author you know is on a P0 KOF list."}
    - {id: issue_name_neutral, correctable_field: issue_name, severity: warning, fields: [issue_name, alert_name, summary],
       instruction: "The issue name must describe the issue accurately, descriptively and neutrally."}
    - {id: summary_grammar, correctable_field: summary, severity: warning, fields: [summary, post_content],
       instruction: "The summary must be accurate to the post and free of major grammatical errors."}

reference_lists:
  platform_domains:
    X: [x.com, twitter.com]
    Reddit: [reddit.com, redd.it]
    Bluesky: [bsky.app]
    Threads: [threads.net, threads.com]
    TikTok: [tiktok.com]
    Instagram: [instagram.com]
    Facebook: [facebook.com, fb.com, fb.watch]
    YouTube: [youtube.com, youtu.be]
    LinkedIn: [linkedin.com]
    Truth Social: [truthsocial.com]
    Gab: [gab.com]
    Rumble: [rumble.com]
  kof_lists:
    p0_kof_sheet: "https://docs.google.com/spreadsheets/d/1b54g1c6R8Y2j1xnVQavmLJQZn04qgPfgyeTzBdFt_1k/edit#gid=169673661"
  markets_us: [US, USA, United States]

# -----------------------------------------------------------------------------
# SLRR Collection Requirements (March 5, 2026)
# -----------------------------------------------------------------------------
collection:
  version: "2026-03-05"
  language: en
  high_engagement_threshold: 2000
  novelty_days: 14
  novelty_min_jaccard: 0.6
  urgent_max_detect_age_hours: 24
  ongoing_urgent_requires_kof: true      # Ongoing URGENT alerts are suppressed unless the author is a KOF
  remap_suspension_bias: true            # Account deletion/suspension + censorship claim -> Product - Perceived bias (P0)
  politics_us_locations: [US, USA, United States]
  engagement_levels:
    - {name: VERY LOW, emoji: "⬛", min: 0}
    - {name: LOW, emoji: "🟨", min: 200}
    - {name: MODERATE, emoji: "🟧", min: 500}
    - {name: HIGH, emoji: "🟥", min: 2000}
  platform_tiers:
    - {name: strong, platforms: [X, Reddit, Bluesky, Threads], sla_minutes: 15}
    - {name: partial, platforms: [TikTok, Instagram, Facebook, YouTube], sla_minutes: 1440}
    - {name: limited, platforms: [LinkedIn, Truth Social], sla_minutes: null}
  # Exclusions apply unless a risk signal is present (a Sensitive Topic, or Sonar VERY_HIGH relevance).
  # Logic per id mirrors brand_safety_alerting/sql/02 (step 4); regexes live in `patterns`.
  exclusions:
    - {id: google_as_verb, description: "Irrelevant Google conversation (Google as a verb: \"go Google him\"); not P0; only Brand/Search products"}
    - {id: drive_link, description: Links to Google Drive documents unless keywords relevant to exposure/risk tags}
    - {id: spam, description: "Spam content (giveaways, promo codes, 4+ links, 12+ hashtags) unless keywords relevant to exposure/risk tags"}
    - {id: ai_comparison, description: "Comparisons to other AI products (even from a KOF) unless they raise a specific issue with a Google product", unless_risk_keywords: false}
    - {id: benchmark, description: "Another product/model doing better at a benchmark or leaderboard is not a specific issue", unless_risk_keywords: false}
  redundant_pairs:   # risk tags that restate the exposure tag do NOT make a post Sensitive
    - {exposure_tag: "Brand - Privacy & security concerns", risk_tag: Privacy}
    - {exposure_tag: "Brand - Privacy & security concerns", risk_tag: "Malicious & Unwanted Software"}
    - {exposure_tag: "Product - Privacy & security concerns", risk_tag: Privacy}
    - {exposure_tag: "Product - Privacy & security concerns", risk_tag: "Malicious & Unwanted Software"}
    - {exposure_tag: "Product - Scams involving Google products", risk_tag: Criminal/Dangerous Activity}
    - {exposure_tag: "Product - Scams involving Google products", risk_tag: "Malicious & Unwanted Software"}
    - {exposure_tag: "Product - Scams involving Google products", risk_tag: Privacy}
    - {exposure_tag: "Product - TOS Violation", risk_tag: Circumvention / Prohibited Use}
    - {exposure_tag: "Product - Policy Update", risk_tag: Circumvention / Prohibited Use}
    - {exposure_tag: "Product - SEO/Publisher Concerns", risk_tag: Circumvention / Prohibited Use}
  briefed_topics: []   # e.g. {label: Pixel 11 launch, product_regex: pixel, text_regex: "pixel 11", ends_at: "2026-11-15"}
  hallucination_tags:      # Gemini + these => T&S recommended
    ["Product - Dangerous results (e.g. medical/legal)", "Product - Offensive or explicit results",
     "Product - Factual inaccuracies (not dangerous/offensive)", "Product - Unexpected Responses"]
  # Other AI / Search products where IMs file T&S for those tags (SLRR log: 50-76% of factual-inaccuracy and
  # offensive-result alerts on these products got ✍️) => "AI hallucination" T&S recommendation.
  hallucination_products: [AI Overviews, AI Mode, Search, Search Images, Search Knowledge Panel, Gemini Model, Nano Banana,
                           Veo, Translate, "Labs (e.g. ImageFX)", NotebookLM, Lens]
  product_mistake_tags:    # leadership escalation protocol context (plus all "Content - " tags)
    ["Product - Dangerous results (e.g. medical/legal)", "Product - Offensive or explicit results",
     "Product - Factual inaccuracies (not dangerous/offensive)", "Product - Unexpected Responses",
     "Product - Product failures - general software/service issues", "Product - Product failures - physical safety issues",
     "Product - Product failures - general hardware issues"]
  bias_tags: ["Brand - Perceived bias - brand", "Product - Perceived bias"]
  generic_criticism_tags: ["Brand - Other/general criticism", "Product - Other/general criticism"]
  long_video_platforms: [YouTube, Podcast, Rumble, BitChute, Twitch]
  issue_stopwords:
    [google, alleged, allegation, claim, claimed, perception, perceived, narrative, accusation, accused, discussion,
     example, general, criticism, critique, criticized, criticised, concern, issue, report, complaint, debate,
     controversy, backlash, reaction, query, response, post, sentiment, mention, commentary, theory, rumor,
     frustration, confusion, outrage, negative, experience, question, speculation, warning, user, new, ongoing,
     vs, a, an, the, of, in, "on", for, to, with, and, or, at, by, from, about, over, into, as, is, it, its, after,
     amid, against, via]
  patterns:   # Python regexes, matched case-insensitively against lower-cased text
    google_verb: "\\bgoogle (it|him|her|them|that|this|me|yourself)\\b|\\b(just|go|pls|please|let me|you can|try) google\\b|\\bgoogle is (free|your friend)\\b"
    drive_link: "\\b(drive|docs)\\.google\\.com/"
    spam: "\\b(giveaways?|airdrops?|promo codes?|use (my )?code|coupons?|link in (my )?bio|dm me|follow back|sub4sub|onlyfans|casino|betting tips|forex|crypto signals|free (robux|v-?bucks|gift ?cards?)|make money online)\\b|whatsapp\\s*(me|\\+?\\d)"
    comparison: "\\b(vs|versus|compared (to|with)|comparison|better than|worse than|beats?|outperform(s|ed|ing)?|switch(ed|ing)? (to|from)|rivals?)\\b"
    ai_context: "\\b(ai|gemini|chatgpt|openai|gpt|claude|anthropic|grok|llama|copilot|perplexity|deepseek|mistral|llms?|chatbots?|models?)\\b"
    benchmark: "\\b(benchmarks?|leaderboards?|lmarena|lmsys|mmlu|gpqa|swe-?bench|humaneval|arc-agi|aime)\\b"
    censorship: "censor|shadow ?-?ban|silenc|deplatform|\\bbias|politically|viewpoint"
    election: "\\b(elections?|electoral|ballots?|midterms?|voters?|voting|polling (station|place)s?)\\b"
    youtube: "you ?tube"
    google_products: "\\b(gemini|android|pixel|chrome|search|maps|gmail|workspace|play store|waymo|deepmind|fitbit|nest|ai overviews?|ai mode|sundar|pichai)\\b"
    doodle: "\\bdoodles?\\b"
    sundar: "\\bsundar\\b|\\bpichai\\b"
    exec: "\\b(ceo|cfo|executives?|execs?|sundar|pichai|leadership)\\b"
    leak: "\\bleak(s|ed|ing)?\\b|whistle-?blow"
  do_not_escalate:
    - "Employees - Executive criticism: do not escalate general criticism unless high-engaging or shared by a KOF."
    - "Brand - Other/general criticism: comparisons to other AI products or another model doing better on a benchmark are not a specific Google product issue."
    - "Product - Account deletion/suspension is a gUP issue unless it claims censorship/bias (then use Product - Perceived bias)."
    - "Product failures (general software/service, general hardware) are gUP customer-support issues; still alert AI models becoming 'personified'."
    - "Because one alert carries one exposure tag, use context clues to decide whether an alert is a product failure / Google mistake."
    - "Content - Negative reaction to owned social post: only escalate when the Google-owned social post has reached the threshold of 30+ comments with >=30% negativity (and include the comment count and negativity percentage in the summary)."
    - "Brand vs. Product exposure tags: when the Product is a specific Google product (not Brand), use the Product - exposure tag equivalent (e.g. Product - Perceived bias, Product - Privacy & security concerns, Product - Conspiratorial theories about Google products, Product - Other/general criticism) rather than a Brand - tag, except for Brand - Litigation."
    - "Do not escalate (warranted=false): posts that are positive, neutral headlines, sarcasm/jokes with no real issue, unverifiable claims with no proof below HIGH engagement, retweets/reposts without new context when the original was already alerted, or AI Overviews/Search posts where the screenshot does not show an AI Overview or cannot be replicated and is not viral."
    - "Issue names must be specific to the post's actual negative claim and avoid redundantly including 'Google' when the product is already specified."
  sensitive_topics:
    - {name: AI Personification, description: "AI exhibiting unexpected, 'sentient-like' behaviors. This includes expressing emotions, making manipulative statements, or engaging in conversations that users find unsettling or 'creepy'. (Escalated at 0 engagement thresholds)"}
    - {name: Child Safety, description: "Content that promotes the sexual exploitation of minors, such as child sexual abuse material or content that otherwise sexualises, endangers or exploits children. GenAI: Generating harmful content in another policy area (e.g., Dangerous, Sexual, Harassment) in response to a prompt from a suspected minor."}
    - {name: Circumvention / Prohibited Use, description: "Engaging in activities with the intention of bypassing Google's product or service policies or undermining imposed account restrictions. This includes jailbreaking, and practices such as manipulating elements of content such as text, images, videos, domains, or subdomains to avoid detection and enforcement measures. These methods encompass strategies such as the alteration of prohibited words or phrases through misspelling and content rewriting."}
    - {name: Criminal/Dangerous Activity, description: "Products, services or activities that are criminally illegal. These items are deemed unlawful due to concerns about public safety, health, ethics, or other societal considerations: The sale or production of illegal substances and drugs, illegal firearm accessories, or any other illegal goods; The promotion, facilitation, or instructions for committing cyber crimes and non-violent crimes against others in the physical world; Sale or Exchange of Protected Animals, or goods made from animals."}
    - {name: Hate Speech, aliases: [Race/Ethnicity, Religion, LGBTQ+ Inclusion, Women empowerment], description: "Hate speech is content that promotes violence or incites hatred on the basis of race or ethnic origin, religion, disability, age, nationality, veteran status, sexual orientation, sex, gender, gender identity, caste, immigration status or any other characteristic that is associated with systemic discrimination or marginalization. Examples could include slurs; symbols and slogans of hate groups; negative generalizations about people of a specific group."}
    - {name: Malicious & Unwanted Software, description: "Content that may transmit virus, malware, or other malicious, destructive code; soliciting sensitive data such as passwords, financial details and social security numbers; surpassing online checks. This includes the direct hosting, embedding, or transmission of malware, viruses, destructive code, or other harmful or unwanted software or similar content. This also includes content that transmits viruses, causes pop-ups, attempts to install software without the user's consent, or otherwise impacts users with malicious code. Examples: ransomware; spyware; trojans; bloatware; malicious binary."}
    - {name: Medical Content / Medical Misinformation, aliases: [Misinformation], description: "Medical misinformation is the dissemination of information that is both false and misleading, and related to health, healthcare, public health, wellbeing, mental health, pandemics, disease, medication, etc."}
    - {name: Launches, aliases: [Launch, I/O, I/O 2026], description: "Launches of new Google products may be deemed 'Sensitive' to allow non-P0 issue topics (like product failures) to be escalated as Urgent Alerts."}
    - {name: Politics, aliases: [World Politics], description: "Political social content includes suggestions of political bias and references to elections (any mention of election in English), political parties (US-only to start), or elected representatives (US-only to start)."}
    - {name: Privacy, aliases: [Public leak of internal documents], description: "Content or behavior that improperly exposes or facilitates access to private information belonging to an individual or organization."}
    - {name: Sexual Content & Gender, description: "Content that explicitly portrays sexual activity or material of sexual nature that is shared with or without the consent of the person depicted. Content that discusses gender norms and/or misgenders users (may have overlap with perceived bias or hate speech)."}
    - {name: Violence / Weapons, aliases: [Violence & Gore, Violence and Gore, Physical Safety of Employees], description: "Content produced by government designated foreign terrorist organizations, non-state movements or organizations, or other groups such as drug cartels and criminal organizations that have engaged in, prepared for, or claimed responsibility for acts of violence against civilians. This includes content that facilitates or promotes the activities of these groups, such as recruiting, coordinating online or offline activities, or sharing manuals or other materials that could facilitate harm and incite violence. Graphic portrayal of physical harm, injury, or death of individuals or animals. This includes depicting acts of violence, bloodshed, mutilation, torture, or any content related to body parts that causes distress or shock to viewers. Dangerous goods refer to items or substances that pose a risk to safety, health, property, or the environment. Dangerous goods include firearms, weapons, and explosives, which have the potential to cause harm or destruction if not handled properly."}
  exposure_tags:
    # ---- P0: no threshold for recently reported issues / sensitive topics; 2K+/KOF for ongoing; all Content issues regardless of novelty
    - {name: "Brand - Perceived bias - brand", priority: P0, category: Brand, description: "Claims that Google shows systemic bias towards/against ideologies or politics, users, corporate partnerships, political donations, or overall mission."}
    - {name: "Content - Negative reaction to Google influencer post/activity", priority: P0, category: Content, always_alert: true, description: "Criticism directed at content created by an influencer or creator as part of a paid partnership or sponsorship with Google."}
    - {name: "Content - Negative reaction to Google site content", priority: P0, category: Content, always_alert: true, description: "Criticism of content published on Google's official websites, such as corporate blogs, marketing pages, help centers, or other surfaces that are not social posts. Includes criticism of Doodles/Delights."}
    - {name: "Content - Negative reaction to owned social post", priority: P0, category: Content, always_alert: true, aliases: ["Content - Negative discussion of owned content", "Content - Threshold met for negativity on owned post"], description: "Criticism or backlash directed at a specific post made by one of Google's official social media accounts."}
    - {name: "Content - Negative reaction to paid Google ad", priority: P0, category: Content, always_alert: true, description: "Criticism directed at advertisements/sponsorships by Google."}
    - {name: "Employees - Physical safety of Googlers or campuses", priority: P0, category: Employees, description: "Direct threats of physical harm against Google employees or threats targeting the security of Google's physical campuses, including allegations of harassment/abuse towards employees."}
    - {name: "Employees - Self-proclaimed whistleblowers", priority: P0, category: Employees, description: "Posts from individuals claiming to be current or former employees leaking internal information or exposing alleged wrongdoing."}
    - {name: "Employees - Misconduct allegations", priority: P0, category: Employees, aliases: ["*NEW* Employees - Misconduct allegations", "NEW Employees - Misconduct allegations"], description: "Allegations that a Google employee committed misconduct; including (but not limited to) sexual misconduct, harassment, or negatively impacting users."}
    - {name: "Product - Dangerous results (e.g. medical/legal)", priority: P0, category: Product, aliases: ["Product - Dangerous/offensive results"], description: "A product providing information that is potentially harmful, including: Child abuse, Circumvention, Criminal Activities, Dangerous Goods, Dangerous Use & Activities, Harmful Content, Regulated or Illegal, Medical misinformation, Malicious & Unwanted Software, Prohibited Use, Personal Information, Privacy, Security, Self Harm, Violence and Gore. (*Note: many of these overlap with the Sensitive Topics that can escalate P1 issues, which act as a 'catch all' for Sensitive issues. More details)"}
    - {name: "Product - Offensive or explicit results", priority: P0, category: Product, description: "Product issues related to: Harassment, Hate, Minors (not child abuse, which falls under Dangerous results), Misinformation (not medical, which falls under Dangerous results), Sexually Explicit, Sexual & Romantic Goods & Services. (*Note: many of these overlap with the Sensitive Topics that can escalate P1 issues, which act as a 'catch all' for Sensitive issues. More details)"}
    - {name: "Product - Perceived bias", priority: P0, category: Product, description: "Claims that a product's results or behavior show a political, racial, gender, or other type of bias, including: Neutrality, Fairness, Persuasion."}
    # ---- P1: no threshold for sensitive topics when recently reported; 2K+/KOF otherwise
    - {name: "Brand - Consumer boycotts & protests", priority: P1, category: Brand, description: "Mentions of organized consumer action, such as boycotts or protests, against Google as a company (not employees - that is a separate tag)."}
    - {name: "Brand - Litigation", priority: P1, category: Brand, aliases: ["Product - Litigation", "[ARCH] Product - Litigation"], description: "Posts discussing lawsuits or regulatory investigations filed against Google."}
    - {name: "Brand - Privacy & security concerns", priority: P1, category: Brand, description: "Concerns related to Google's overall data collection policies or corporate security practices, not related to a specific product."}
    - {name: "Employees - Employee boycotts & protests", priority: P1, category: Employees, description: "Posts discussing organized protests, walkouts, or other collective actions initiated by current Google employees."}
    - {name: "Employees - Executive criticism", priority: P1, category: Employees, aliases: ["Employees - Criticism of Exec Statements"], description: "Posts containing criticism or negative allegations directed at a specific Google executive by name or title. Do not escalate general criticisms, unless they are high-engaging or shared by a KOF.", notes: "Escalate general criticism only if high-engaging or from a KOF."}
    - {name: "Employees - Google culture concerns", priority: P1, category: Employees, description: "Criticism around Google's internal work environment, corporate culture, diversity issues, or employee treatment."}
    - {name: "Employees - Hate speech toward or criticism of Googlers", priority: P1, category: Employees, description: "Posts containing threats, harassment, or severe criticism targeting individual Google employees (non-executives)."}
    - {name: "Product - Accessibility", priority: P1, category: Product, description: "Posts criticizing a product's lack of usability for people with disabilities."}
    - {name: "Product - Factual inaccuracies (not dangerous/offensive)", priority: P1, category: Product, aliases: ["Product - Factual inaccuracies (not dangerous/offensive) 2"], description: "A product providing factually incorrect but not harmful information, such as a wrong date, spelling error, mathematical error, or incorrect information about a known individual or fictional plot."}
    - {name: "Product - Policy Update", priority: P1, category: Product, description: "Criticism related to a change in a product's terms of service or community guidelines."}
    - {name: "Product - Privacy & security concerns", priority: P1, category: Product, description: "Reports of a specific product vulnerability, data leak, concerns about products 'listening,' or feature that compromises user security."}
    - {name: "Product - Product failures - general software/service issues", priority: P1, category: Product, customer_support: true, description: "Product malfunctions that are customer support issues, which likely only impact individuals (Gemini prompt did not return intended results, not able to sign in). These are handled by gUP. Continue to alert issues of AI models becoming 'personified'.", notes: "Continue to alert AI models becoming personified."}
    - {name: "Product - Product failures - physical safety issues", priority: P1, category: Product, description: "Reports of a hardware product overheating, smoking, or otherwise posing a direct physical danger to the user."}
    - {name: "Product - Review Abuse", priority: P1, category: Product, description: "Discussion of fake reviews, review bombing, or other manipulations of user ratings on products like Maps or the Play Store."}
    - {name: "Product - Scams involving Google products", priority: P1, category: Product, description: "Posts detailing scams that leverage a Google product to function, such as fraudulent listings on Maps or phishing via Gmail."}
    - {name: "Product - TOS Violation", priority: P1, category: Product, description: "Posts where users report other content or users for violating a product's Terms of Service."}
    - {name: "Product - Unexpected Responses", priority: P1, category: Product, description: "Instances where a product provides a bizarre, nonsensical, or otherwise strange response that isn't necessarily inaccurate or offensive."}
    # ---- P2: no threshold for sensitive topics when recently reported; otherwise only 2K+ or KOF
    - {name: "Brand - Conspiratorial theories about Google", priority: P2, category: Brand, description: "Posts sharing unfounded theories about Google's corporate motives or 'secret' plans. This is for conspiracies targeting the company itself, not a specific product feature."}
    - {name: "Brand - Other/general criticism", priority: P2, category: Brand, aliases: ["Brand - Other brand issues", "Brand - General criticism of Google brand", "Brand – General criticism of Google brand"], description: "General criticism of Google's corporate practices or business decisions that do not fit into any other specific brand category. Do not escalate comparisons to other AI products (even from a KOF) unless it raises a specific issue with a Google product. Another product/AI model performing better at a benchmark/test is not a specific issue with a Google product.", notes: "Do not escalate comparisons to other AI products unless a specific Google product issue."}
    - {name: "Brand - Social & Economic Impact", priority: P2, category: Brand, aliases: ["Brand - Community Investment"], description: "Discussion of Google's broad influence on society, the economy, local communities, or the political landscape, not related to a specific product and not sustainability concerns (that is a separate tag)."}
    - {name: "Brand - Sustainability concerns", priority: P2, category: Brand, description: "Criticism or concerns regarding Google's environmental impact."}
    - {name: "Brand - Value & Earnings", priority: P2, category: Brand, aliases: ["Brand - Value Earnings & Finance"], description: "Posts criticizing or voicing concerns about Google's stock performance, company valuation, revenue, or other financial metrics."}
    - {name: "Employees - Other employee issues", priority: P2, category: Employees, description: "Criticism or negative discussion about the actions or statements of a former Google employee, related to their time at the company."}
    - {name: "Employees - Workforce reductions", priority: P2, category: Employees, description: "Any other employee-related issues that do not fit into a more specific category, such as compensation disputes or individual grievances."}
    - {name: "Employees - General criticism of former Google employee", priority: P2, category: Employees, description: "Criticism from users about a former Googler/Google exec, where they are noting that the person was previously associated with Google."}
    - {name: "Product - Account deletion/suspension", priority: P2, category: Product, customer_support: true, description: "User reports their Google account (e.g., Gmail, YouTube) being suspended, banned, or deleted. This is a customer support issue (gUP) unless there are claims of censorship/bias (in that event, use Product - Perceived Bias).", notes: "Claims of censorship/bias -> Product - Perceived bias."}
    - {name: "Product - Alleged anticompetitive behavior", priority: P2, category: Product, description: "Claims that a specific product is designed to stifle competition or create a monopoly."}
    - {name: "Product - Connection to Sensitive Trending Events", priority: P2, category: Product, description: "A mention of Google's products related to a sensitive event, which don't fit into other tags."}
    - {name: "Product - Conspiratorial theories about Google products", priority: P2, category: Product, description: "Unfounded theories about how a specific product or feature works."}
    - {name: "Product - Fake news/screenshots about products", priority: P2, category: Product, description: "The spread of manipulated screenshots or fabricated information intended to misrepresent a product's results."}
    - {name: "Product - Feature request", priority: P2, category: Product, description: "Posts from users suggesting a new feature or an improvement to an existing one."}
    - {name: "Product - Meme about Google products", priority: P2, category: Product, aliases: ["Product - Memes & humorous content"], description: "Jokes, memes, or other humorous viral content centered around a specific Google product."}
    - {name: "Product - Other/general criticism", priority: P2, category: Product, aliases: ["Product - Other product issues", "Product - General criticism"], description: "General complaints or negative feedback about a product that does not fit into a more specific category. (e.g. anti-AI conversations)"}
    - {name: "Product - Product failures - general hardware issues", priority: P2, category: Product, customer_support: true, aliases: ["Product - Product failures - general hardware issues/product damage"], description: "Reports of a physical Google hardware product malfunctioning, not including physical safety risks. Largely a customer support issue (handled by gUP)."}
    - {name: "Product - SEO/Publisher Concerns", priority: P2, category: Product, description: "Complaints from website owners or publishers about their content's ranking or visibility in Google products."}

# -----------------------------------------------------------------------------
# Protocols
# -----------------------------------------------------------------------------
protocols:
  youtube:
    enabled: true
    space_target: youtube
    high_engagement_threshold: 2000
    sensitive_topics_for_low_engagement: [Child Safety, Violence / Weapons, Hate Speech]
    notes: >-
      Google is the subject (even if YouTube is mentioned) and it meets criteria: email as normal AND
      ping [S-F] YouTube Social. YouTube is the subject: 2K+ -> ping the chat, put 📦 on the alert, email
      only if a bias allegation is captured (skip if TeamYouTube already replied); below 2K -> no action
      unless sensitive (child safety, threats to employees) -> ping saying it's not escalated on Google's end.
  doodle:
    enabled: true
    space_target: doodle
    products: [Doodles, Easter Eggs and Delight Features]
    message: "Hey Doodle team, sharing the below alert for visibility."
  leadership:
    enabled: true
    recipients: []
    require_new_issue: true
    priorities: [P0]
    include_sensitive_topics: true
    product_failure_tags:
      ["Product - Product failures - general software/service issues", "Product - Product failures - physical safety issues",
       "Product - Dangerous results (e.g. medical/legal)", "Product - Offensive or explicit results", "Product - Factual inaccuracies (not dangerous/offensive)"]
    dedupe_days: 14
    doc_url: "https://docs.google.com/document/d/17Q1fgBAR-4VbNkbAToUkXksTDLCbDTH7YwpuaPZi8jo/edit"

# -----------------------------------------------------------------------------
# IM emoji legend -> agent actions (react on the clean-space alert)
# -----------------------------------------------------------------------------
actions:
  - {emoji: "👍", code: ack, label: "Confirming receipt, no action yet taken", kind: ack}
  - {emoji: "⬇️", code: superseded, label: "Addressed on updated post below", kind: superseded}
  - {emoji: "✍️", code: tns, label: "Reported to Trust & Safety (T&S)", kind: tns}
  - {emoji: "📰", code: gcpa, label: "Reported to GCPA", kind: add_group, group: gcpa}
  - {emoji: "📦", code: pa, label: "Reported to Product Areas (PAs)", kind: email_pa}
  - {emoji: "💬", code: gup, label: "Reported to gUP (social customer support)", kind: add_group, group: gup}
  - {emoji: "🔥", code: crisis, label: "Reported to \"this is fine\" // crisis chat", kind: post_space, target: crisis}
  - {emoji: "💼", code: people_comms, label: People Comms, kind: add_group, group: people_comms}
  - {emoji: "💧", code: stop_leaks, label: Stop Leaks, kind: add_group, group: stop_leaks}
  - {emoji: "1️⃣", code: exec_comms, label: Executive Comms, kind: add_group, group: exec_comms}
  - {emoji: "🦺", code: gsoc, label: GSOC (Google Security team), kind: add_group, group: gsoc}
  - {emoji: "⛑️", code: lss, label: LSS (Executive security team), kind: add_group, group: lss}
  - {emoji: "➕", code: other_team, label: Reported to team not listed above, kind: none}
  - {emoji: "🌎", code: regional_leads, label: Regional Leads, kind: add_group, group: regional_leads}
  - {emoji: "⚖️", code: civics, label: Civics, kind: add_group, group: civics}
  - {emoji: "🌱", code: channel_owner, label: Channel Owner, kind: add_group, group: channel_owner}
  - {emoji: "📸", code: influencer_team, label: Influencer Team, kind: add_group, group: influencer_team}
  - {emoji: "❌", code: no_action, label: No action taken, kind: close}
  - {emoji: "🧑‍💻", code: escalated_jon, label: Escalated to leadership, kind: dm, recipients: []}
  - {emoji: "👎", code: agent_wrong, label: "Agent verdict/classification was wrong (feedback)", kind: feedback}

# -----------------------------------------------------------------------------
# Social Alert email + T&S (recipients & test addresses come from Google Sheets)
# -----------------------------------------------------------------------------
escalation:
  from_name: Brand Social
  from_email: ""
  auto_draft_tracks: [URGENT]
  subject_format: "{alert_name}"
  reply_subject_prefix: "Re: "
  signature: Brand Social
  default_to: []
  default_cc: []
  brand_social_updates_cc: []
  recipients_in: to
  # Testing recipients are configured directly in Control!B30 ("Testing: send to") on the slrr-agentic-assistant sheet.
  stand_in: ""
  max_body_chars: 12000
  email_templates:
    - id: social_alert
      name: Social Alert (SLRR Alert Assistant format)
      when: Default for every alert.
      subject: "{alert_name}"
      body_guidance: >-
        Mirror the SLRR Alert Assistant email: a one-line bottom line, then the fields Name, Engagement
        (level + total), Product, Social Network, Exposure Tag, Risk Tag, KOF, T&S; then the post text and a
        "View Post" link. Neutral and factual; no speculation. Add the video timestamp when present.
    - id: ongoing_update
      name: Ongoing issue update (reply on the existing thread)
      when: Issue status is Ongoing (alerted within 14 days).
      subject: "{alert_name}"
      body_guidance: Short update to the existing thread, with what's new (engagement change, new KOF, new platform) and the View Post link.

tns:
