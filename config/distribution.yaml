# Non-product-specific alert groups + emoji-legend groups.
# Recipients are resolved dynamically at runtime from matching rows on `Brand safety groups`.
groups:
  - name: Civics
    action_code: civics
    auto_include: true
    recipients: []
    triggers:
      sensitive_topics: [Politics, Child Safety, Hate Speech, Violence / Weapons, Criminal/Dangerous Activity, "Sexual Content & Gender",
                         "Malicious & Unwanted Software", AI Personification, Medical Content / Medical Misinformation, Privacy,
                         Circumvention / Prohibited Use]
      sensitive_topics_urgent_only: true
      sensitive_topics_any_engagement: [Medical Content / Medical Misinformation, Violence / Weapons]
      exposure_tags: ["Brand - Litigation", "Product - Litigation"]
  - name: gUP (social customer support)
    action_code: gup
    auto_include: true
    recipients: []
    triggers:
      exposure_tags: ["Product - Product failures - general software/service issues", "Product - Product failures - general hardware issues", "Product - Account deletion/suspension", "Product - Privacy & security concerns"]
    notes: Resolved from product gUP group when configured on Brand safety groups.
  - name: LSS / Exec Security
    action_code: lss
    auto_include: true
    recipients: []
    triggers:
      match: all
      exposure_tags: ["Employees - Physical safety of Googlers or campuses"]
      keywords: ["\\b(ceo|cfo|executives?|execs?|sundar|pichai|leadership)\\b"]
  - name: People Comms
    action_code: people_comms
    auto_include: true
    recipients: []
    triggers:
      exposure_tag_prefixes: ["Employees - "]
  - name: Executive Comms
    action_code: exec_comms
    auto_include: true
    recipients: []
    triggers: {exposure_tags: ["Employees - Executive criticism"], sundar_mention: true}
    notes: Resolved from the Executives row on Brand safety groups.
  - name: Stop Leaks
    action_code: stop_leaks
    auto_include: true
    recipients: []
    triggers:
      exposure_tags: ["Product - Public leak (e.g. features/models)", "Employees - Self-proclaimed whistleblowers"]
      keywords: ["\\bleak(s|ed|ing)?\\b|whistle-?blow"]
  - name: Influencer Team
    action_code: influencer_team
    auto_include: true
    recipients: []
    triggers: {exposure_tags: ["Content - Negative reaction to Google influencer post/activity"]}
  - name: GCPA
    action_code: gcpa
    auto_include: true
    is_placeholder: true
    recipients: []
    triggers:
      exposure_tag_prefixes: ["Brand - ", "Product - ", "Employees - ", "Content - "]
      exclude_products: [YouTube, YT]
    notes: "Global Communications & Public Affairs distro (📰); resolved from Brand safety groups when present."
  - name: GSOC
    action_code: gsoc
    auto_include: true
    is_placeholder: true
    recipients: []
    triggers: {exposure_tag_prefixes: ["Employees - "]}
    notes: "Google Security Operations (🦺); resolved from Brand safety groups when present."
  - name: Regional Leads
    action_code: regional_leads
    auto_include: true
    is_placeholder: false
    recipients: []
    triggers: {non_us_market: true}
    notes: "Regional teams are alerted when their markets are mentioned (🌎); resolved from Brand safety groups when present."
  - name: Channel Owner
    action_code: channel_owner
    auto_include: true
    is_placeholder: false
    recipients: []
    triggers: {exposure_tags: ["Content - Negative reaction to owned social post", "Content - Negative reaction to paid Google ad"], owned_post: true}
    notes: "Owners of Google-owned social channels (🌱); resolved dynamically when configured."

