# The temp check app's setup, kept as data: the five tables of posts it searches, each read the way the app reads it
# (tempcheck-app/lib/owndata.js), and the Brandwatch values it uses (tempcheck-app/lib/brandwatch.js).
#
# Nothing here is used by itself. "Find and fill" on the Console's Integrations page writes these into the settings
# that are still empty (Settings, Temp check); from then on the settings are what counts, and each can be changed or
# switched OFF there. tests/test_tempcheck_tables.py checks this file against the app's own code.
#
# The order of the tables matters: when one post is in several tables with the same engagement known, the copy from
# the earlier table is kept.

brandwatch:
  brandwatch_project_id: "1998344909"          # [SLRR] Private: the team's [G EVENT] queries
  brandwatch_token_secret: slrr-campaigns-bw-token
  event_query_prefix: "[G EVENT]"
  standing_query_name: "[V2] MAIN G Landscape ("   # the standing queries that together hold every mention of Google
  standing_query_skip: benchmark

tables:
  - key: alerts
    label: Sundar all mentions
    what: >-
      Sundar all mentions, the Brandwatch alert-feed rows: X, Instagram, Facebook, Bluesky and Reddit, minutes
      behind. X posts come with their words.
    table: brand-social-central-data.social_alerts_dataset.all_sundar_mentions
    location: US
    freshness: minutes behind
    has: [text, author, url, platform, followers]
    dedupe_by: url
    x_lookup: true
    read_sql: |-
      SELECT IF(LOWER(SocialNetwork) = 'twitter', 'x', LOWER(SocialNetwork)) AS platform, authorHandle AS author,
        snippet AS text, url, postTime AS posted, followers, engagementScore AS eng, LOWER(Sentiment) AS sentiment,
        CAST(NULL AS STRING) AS language, CAST(NULL AS INT64) AS shares, CAST(NULL AS INT64) AS replies,
        ingestionTimestamp AS seen, url AS one
      FROM `{table}`
      WHERE ingestionTimestamp >= @t_from AND ingestionTimestamp < TIMESTAMP_ADD(@t_to, INTERVAL 24 HOUR)

  - key: sonar
    label: Sonar
    what: >-
      The Sonar feed: X, YouTube, Bluesky, Instagram, TikTok, Reddit and more, minutes after posting.
    table: bsip-s-bsip-gg-26-2cf3.google_bg.sonar_raw
    location: us-central1
    freshness: minutes after posting
    has: [text, author, url, platform, followers, language]
    dedupe_by: url
    x_lookup: false
    read_sql: |-
      SELECT IF(LOWER(platform) = 'twitter', 'x', LOWER(platform)) AS platform,
        JSON_VALUE(payload, '$.detail.channel.username') AS author, JSON_VALUE(payload, '$.detail.post.snippet.text') AS text,
        post_url AS url, SAFE_CAST(post_timestamp AS TIMESTAMP) AS posted, follower_count AS followers,
        IFNULL(engagement_likes, 0) + IFNULL(engagement_comments, 0) + IFNULL(engagement_shares, 0) AS eng,
        CAST(NULL AS STRING) AS sentiment, LOWER(language) AS language, engagement_shares AS shares,
        engagement_comments AS replies, received_at AS seen, post_id AS one
      FROM `{table}`
      WHERE received_at >= @t_from AND received_at < TIMESTAMP_ADD(@t_to, INTERVAL 24 HOUR)

  - key: brandwatch
    label: Brandwatch stored mentions
    what: >-
      Brandwatch's stored mentions: news, Reddit, forums, blogs, reviews, Bluesky, Instagram, YouTube and
      Facebook. A day's mentions arrive the day after, and its X rows have no words, so they never match.
    table: brand-social-central-data.raw_data.brandwatch_raw_mentions_base
    location: US
    freshness: a day behind
    has: [text, author, url, platform, language]
    dedupe_by: url
    x_lookup: false
    read_sql: |-
      SELECT CASE LOWER(platform) WHEN 'twitter' THEN 'x' WHEN 'facebook_public' THEN 'facebook'
          WHEN 'instagram_public' THEN 'instagram' WHEN 'linkedin_brand_mentions' THEN 'linkedin' ELSE LOWER(platform) END AS platform,
        author,
        CASE WHEN TRIM(IFNULL(mention_text, '')) = '' THEN NULLIF(TRIM(IFNULL(title, '')), '')
          WHEN TRIM(IFNULL(title, '')) = '' OR STARTS_WITH(mention_text, SUBSTR(TRIM(title), 1, 30)) THEN mention_text
          ELSE CONCAT(TRIM(title), ': ', mention_text) END AS text,
        post_url AS url, published_timestamp AS posted, CAST(NULL AS INT64) AS followers,
        SAFE_CAST(ROUND(engagement_score) AS INT64) AS eng, LOWER(sentiment) AS sentiment, LOWER(language) AS language,
        CAST(NULL AS INT64) AS shares, CAST(NULL AS INT64) AS replies, load_timestamp AS seen, mention_id AS one
      FROM `{table}`
      WHERE report_date BETWEEN DATE_SUB(DATE(@t_from), INTERVAL 1 DAY) AND DATE_ADD(DATE(@t_to), INTERVAL 1 DAY)
        AND mention_id IS NOT NULL

  - key: sprinklr
    label: Sprinklr comments
    what: >-
      Comments, replies and mentions on Google's own posts and accounts: Instagram, X, Facebook, YouTube, TikTok,
      Threads and LinkedIn, minutes behind. Google's own posts are left out. A comment's link opens the post it is
      under.
    table: brand-social-central-data.reporting_data.sprinklr_inbound_comments
    location: US
    freshness: minutes behind
    has: [text, author, url, platform, followers]
    dedupe_by: id
    x_lookup: false
    read_sql: |-
      SELECT IF(LOWER(platform) = 'twitter', 'x', LOWER(platform)) AS platform, author_username AS author,
        comment_text AS text, post_url AS url, comment_timestamp AS posted, SAFE_CAST(author_followers AS INT64) AS followers,
        SAFE_CAST(ROUND(IFNULL(comment_like_count, 0) + IFNULL(comment_reply_count, 0)) AS INT64) AS eng,
        LOWER(sentiment) AS sentiment, CAST(NULL AS STRING) AS language, CAST(NULL AS INT64) AS shares,
        CAST(NULL AS INT64) AS replies, comment_timestamp AS seen, comment_id AS one
      FROM `{table}`
      WHERE comment_timestamp >= @t_from AND comment_timestamp < TIMESTAMP_ADD(@t_to, INTERVAL 24 HOUR)
        AND comment_id IS NOT NULL AND IFNULL(is_brand_post, '') != 'Brand'
        AND LOWER(IFNULL(is_deleted, 'false')) != 'true' AND LOWER(IFNULL(is_spam, 'false')) != 'true'
        AND LOWER(IFNULL(is_hidden, 'false')) != 'true'

  - key: tubular
    label: Tubular videos
    what: >-
      Tubular's videos that mention Google: YouTube, Instagram, Facebook and TikTok, searched by their titles (it
      has no descriptions or transcripts). A day or two behind.
    table: brand-social-central-data.google_tubular_mentions.tubular_videos
    location: us-central1
    freshness: a day or two behind
    has: [text, author, url, platform, followers]
    dedupe_by: url
    x_lookup: false
    read_sql: |-
      SELECT LOWER(platform) AS platform, creator AS author, video_title AS text, video_url AS url,
        published_at_utc AS posted, SAFE_CAST(creator_followers_or_subscribers AS INT64) AS followers,
        SAFE_CAST(total_engagements AS INT64) AS eng, CAST(NULL AS STRING) AS sentiment, CAST(NULL AS STRING) AS language,
        SAFE_CAST(shares AS INT64) AS shares, SAFE_CAST(comments AS INT64) AS replies, report_run_at_utc AS seen, video_url AS one
      FROM `{table}`
      WHERE snapshot_date BETWEEN DATE(@t_from) AND DATE_ADD(DATE(@t_to), INTERVAL 3 DAY) AND video_url IS NOT NULL
