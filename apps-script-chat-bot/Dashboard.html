<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Burson QA bot · Live</title>
  <!--
    Dashboard.html — the live dashboard web app's page (Dashboard.gs doGet; Control row 54, Live dashboard; row 55,
    Slide deliveries). The page carries no data: every number and word about the bot's work comes from the dash*
    functions through google.script.run (DashboardJs.html). Its look is DashboardCss.html.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&family=Google+Sans+Flex:opsz,wght,ROND@6..144,300..700,0..100&display=swap">
  <script>
    // The viewer's theme choice (Device, Light, Dark), set before the page paints so it never flashes the other one
    (function () {
      try {
        var t = window.localStorage.getItem('dash1.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* the device's choice */ }
    })();
  </script>
  <?!= include_('DashboardCss') ?>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the dashboard</a>
  <div class="bloom" aria-hidden="true"></div>

  <header class="topbar glass">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Burson QA bot <span class="brand-live">Live</span></span>
      </div>
      <div class="areas" role="tablist" aria-label="Areas of the dashboard">
        <button type="button" class="seg-btn" role="tab" id="area-tab-live" aria-controls="area-live" aria-selected="true">Live</button>
        <button type="button" class="seg-btn" role="tab" id="area-tab-slides" aria-controls="area-slides" aria-selected="false" tabindex="-1">Slide deliveries</button>
      </div>
      <div class="topbar-end">
        <span id="mode-chip" class="mode-chip"></span>
        <button type="button" class="btn btn--sm" id="refresh-btn" aria-describedby="fresh-short">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span class="btn-label">Refresh</span>
        </button>
        <span id="fresh-short" class="sr-only"></span>
        <div class="seg theme-seg" role="group" aria-label="Colour theme">
          <button type="button" class="seg-btn" data-theme-choice="device" aria-pressed="true">Device</button>
          <button type="button" class="seg-btn" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" class="seg-btn" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
        <span class="viewer" id="viewer" title="You are signed in as this account"><?= viewerEmail ?></span>
      </div>
      <!-- on a phone, one button stands for the three theme choices (it shows the choice and moves to the next) -->
      <button type="button" class="btn btn--icon theme-cycle" id="theme-cycle" data-choice="device" aria-label="Colour theme: Device. Press for Light.">
        <svg class="tc-device" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="tc-light" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="tc-dark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div id="banners" class="banners"></div>

    <section id="area-live" role="tabpanel" aria-labelledby="area-tab-live">
      <div id="live-root" aria-busy="true">
        <div class="now panel glass" aria-live="polite">
          <p class="loading-word"><span class="spinner" aria-hidden="true"></span><span>Loading what the bot knows...</span></p>
          <div class="skel skel-head" aria-hidden="true"></div>
          <div class="skel skel-line" style="width: 46%" aria-hidden="true"></div>
          <div class="skel skel-line" style="width: 62%" aria-hidden="true"></div>
        </div>
        <div class="section" aria-hidden="true">
          <div class="skel skel-line" style="width: 160px; height: 22px"></div>
          <div class="first-grid" style="margin-top: 12px">
            <div class="skel skel-card"></div>
            <div class="skel skel-card"></div>
            <div class="skel skel-card"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="area-slides" role="tabpanel" aria-labelledby="area-tab-slides" hidden>
      <div id="slides-root"></div>
    </section>
  </main>

  <div id="overlay-root"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <?!= include_('DashboardJs') ?>
</body>
</html>
