<style>
/*
 * DashboardCss.html — the live dashboard web app's look (Control row 54, Live dashboard; row 55, Slide deliveries).
 * Included by Dashboard.html. The tokens are look.md section 8 (Gemini Luminous surfaces, text, accent, pills and
 * focus; AI Studio docs for dense data; ai.google for the chart palette). Light and dark are designed separately: the
 * device's choice is followed unless the viewer picks Light or Dark (html[data-theme]). Text keeps a contrast of at
 * least 4.5:1 on its own fill; glows are outer box-shadows and edge rings, never under text. Glass panels fall back
 * to solid fills where backdrop-filter is not supported. Motion stops for prefers-reduced-motion.
 */
:root {
  color-scheme: light dark;

  /* ---------- Type (Google Sans Flex, look.md 1.3 and 5) ---------- */
  --font-sans: "Google Sans Flex", "Google Sans", Roboto, Arial, sans-serif;
  --font-mono: "Google Sans Code", ui-monospace, monospace;
  --type-display-s: 360 2rem/2.375rem var(--font-sans);
  --type-headline-m: 380 1.5rem/1.875rem var(--font-sans);
  --type-headline-s: 470 1.25rem/1.5rem var(--font-sans);
  --type-title-m: 500 0.9375rem/1.25rem var(--font-sans);
  --type-body-l: 400 1.0625rem/1.5rem var(--font-sans);
  --type-body-m: 400 0.9375rem/1.375rem var(--font-sans);
  --type-body-m-strong: 540 0.9375rem/1.375rem var(--font-sans);
  --type-body-s: 400 0.8125rem/1.125rem var(--font-sans);
  --type-label-s: 500 0.8125rem/1.25rem var(--font-sans);
  --type-button: 500 0.875rem/1.25rem var(--font-sans);
  --type-overline: 500 0.75rem/1.125rem var(--font-sans);
  --type-numeric: 450 2rem/1 var(--font-sans);

  /* ---------- Shape ---------- */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-2xl: 32px;
  --radius-full: 9999px;

  /* ---------- Spacing ---------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-10: 40px;
  --control-h-sm: 32px;
  --control-h: 36px;
  --control-h-lg: 40px;
  --page-max: 1360px;

  /* ---------- Motion ---------- */
  --dur-1: 100ms;
  --dur-2: 150ms;
  --dur-3: 200ms;
  --dur-4: 300ms;
  --dur-5: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-legacy: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out-quint: cubic-bezier(0.23, 1, 0.32, 1);

  /* ---------- State layers ---------- */
  --state-hover: 0.08;
  --state-pressed: 0.12;
  --state-disabled-fg: 0.38;

  /* ---------- Brand constants (both themes) ---------- */
  --gradient-gemini-app: linear-gradient(90deg, #217bfe 0%, #078efb 33.53%, #ac87eb 67.74%, #ee4d5d 100%);
  --gradient-gemini-blue: linear-gradient(89.58deg, #3186ff 0.28%, #346bf0 44.45%, #4ea0ff 99.55%);
  --gradient-gemini-text: linear-gradient(72.83deg, #4285f4 11.63%, #9b72cb 40.43%, #d96570 68.07%);
  --gradient-ring: linear-gradient(45deg, #3186ff 0%, #346bf1 30%, #4fa0ff 50%, #ac87eb 75%, #ee4d5d 100%);
  --blur-glass: blur(20px) saturate(1.8);
  --shadow-prompt: 0 2px 8px -2px rgba(0, 0, 0, 0.16);

  /* ================= LIGHT ================= */
  --surface: #faf9f9;
  --surface-bright: #ffffff;
  --surface-dim: #f2f0f0;
  --surface-container: #ffffff;
  --surface-container-low: #f8fafd;
  --surface-container-high: #e9eef6;
  --surface-container-highest: #dde3ea;
  --glass-fill: rgba(255, 255, 255, 0.82);
  --glass-strong: rgba(255, 255, 255, 0.92);
  --on-surface: #1f1f1f;
  --on-surface-strong: #000000;
  --on-surface-variant: #444746;
  --on-surface-soft: #5f6368;
  --outline: #747775;
  --outline-variant: #c4c7c5;
  --hairline: rgba(0, 0, 0, 0.08);
  --hairline-strong: #d7d8da;
  --primary: #0b57d0;
  --on-primary: #ffffff;
  --primary-container: #d3e3fd;
  --on-primary-container: #0842a0;
  --accent: #9dd2ff;
  --on-accent: #000000;
  --selected: #c2e7ff;
  --on-selected: #004a77;
  --link: #0b57d0;
  --glow: #9dd2ff;
  --glow-2: #e5d9ff;
  --positive: #006c45;
  --positive-container: #daf9d4;
  --negative: #b3261e;
  --negative-container: #fce8e6;
  --warning: #685708;
  --warning-container: #fffbed;
  --warning-edge: #e9d27a;
  --info: #254597;
  --info-container: #e4edff;
  --focus-ring: #000000;
  --row-hover: #f4f5f5;
  --row-active: #ececef;
  --skeleton: rgba(199, 199, 199, 0.22);
  --skeleton-highlight: rgba(199, 199, 199, 0.5);
  --scrim: rgba(0, 0, 0, 0.32);
  --shadow-1: 0 0 20px 0 rgba(0, 0, 0, 0.04);
  --shadow-2: 0 0 20px 0 rgba(0, 0, 0, 0.11);
  --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
  --shadow-card-hover: 0 8px 24px -4px rgba(0, 0, 0, 0.1);
  --shadow-drawer: -12px 0 40px -8px rgba(0, 0, 0, 0.18);
  --glow-shadow: -10px -2px 26px -10px rgba(33, 123, 254, 0.55), 10px 2px 26px -10px rgba(172, 135, 235, 0.55), 0 12px 28px -14px rgba(238, 77, 93, 0.45);
  --glow-shadow-soft: -6px 0 18px -8px rgba(33, 123, 254, 0.45), 6px 0 18px -8px rgba(172, 135, 235, 0.45);

  /* Seriousness: text on its container (>= 5.5:1), and the solid mark the map and dots use */
  --lv-critical-fg: #b3261e; --lv-critical-bg: #fce8e6; --lv-critical-mark: #de2d29;
  --lv-high-fg: #9a3d00;     --lv-high-bg: #ffe6d5;     --lv-high-mark: #ef6c1a;
  --lv-medium-fg: #6b5600;   --lv-medium-bg: #fff1c2;   --lv-medium-mark: #d9a400;
  --lv-low-fg: #254597;      --lv-low-bg: #e4edff;      --lv-low-mark: #3186ff;
  --lv-unknown-fg: #5a3ec8;  --lv-unknown-bg: #ece6ff;  --lv-unknown-mark: #7c5cf0;

  /* Speed marks */
  --sp-surging: #d81b60;
  --sp-rising: #ef6c1a;
  --sp-steady: #3186ff;
  --sp-slowing: #00897b;
  --sp-unknown: #8e918f;

  /* Chart palette (ai.google data-vis, light) */
  --chart-1: #2b4fda;
  --chart-2: #008052;
  --chart-3: #f29900;
  --chart-4: #be1c1b;
  --chart-5: #4d34cf;
  --chart-6: #de249e;
  --chart-neutral: #45474d;
  --chart-grid: rgba(33, 34, 38, 0.12);
}

/* ================= Base ================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--surface);
  color: var(--on-surface);
  font: var(--type-body-m);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
/* The soft Gemini bloom at the top of the page, behind the header and the Now strip only (never under body text) */
.bloom {
  position: fixed; inset: 0 0 auto 0; height: 420px; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 46% 80% at 22% 0%, var(--glow) 0, transparent 70%),
    radial-gradient(ellipse 40% 70% at 78% 0%, var(--glow-2) 0, transparent 70%);
  opacity: 0.55;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-xs); }
button, input, select, textarea { font: inherit; color: inherit; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: var(--space-4); top: -60px; z-index: 100; padding: var(--space-2) var(--space-4);
  background: var(--surface-bright); color: var(--on-surface); border-radius: var(--radius-full); box-shadow: var(--shadow-2);
}
.skip-link:focus { top: var(--space-2); }
.wrap { position: relative; z-index: 1; max-width: var(--page-max); margin: 0 auto; padding: 0 var(--space-6) var(--space-10); }
.muted { color: var(--on-surface-soft); }
.small { font: var(--type-body-s); }
.mono { font-family: var(--font-mono); font-size: 0.8125rem; }
.wrap-any { overflow-wrap: anywhere; word-break: break-word; }
.hidden, [hidden] { display: none !important; }
.nowrap { white-space: nowrap; }

/* ================= Glass ================= */
.glass {
  background: var(--glass-fill);
  -webkit-backdrop-filter: var(--blur-glass);
  backdrop-filter: var(--blur-glass);
  border: 1px solid var(--hairline);
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass { background: var(--surface-bright); }
  .glass-strong { background: var(--surface-bright) !important; }
}
.panel {
  position: relative;
  border-radius: var(--radius-xl);
  padding: var(--space-5) var(--space-6);
  box-shadow: var(--shadow-card);
}
/* The gradient edge (a ring only: the mask keeps its inside empty) and the outer glow (box-shadow: outside only) */
.edge { position: relative; }
.edge::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: var(--gradient-ring);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}
.glow { box-shadow: var(--glow-shadow); }
.glow-soft { box-shadow: var(--glow-shadow-soft); }

/* ================= Header ================= */
.topbar {
  position: sticky; top: 0; z-index: 20;
  border-width: 0 0 1px 0;
  border-radius: 0;
}
.topbar-in {
  max-width: var(--page-max); margin: 0 auto; padding: var(--space-3) var(--space-6);
  display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.brand-mark {
  width: 28px; height: 28px; border-radius: var(--radius-sm); flex: none;
  background: var(--gradient-gemini-app);
  -webkit-mask: radial-gradient(circle at 50% 50%, #000 0 6px, transparent 6.5px), linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: radial-gradient(circle at 50% 50%, #000 0 6px, transparent 6.5px), linear-gradient(#000 0 0);
  mask-composite: exclude;
}
.brand-name { font: var(--type-headline-s); font-variation-settings: "ROND" 20; white-space: nowrap; }
.brand-live {
  background: var(--gradient-gemini-blue); -webkit-background-clip: text; background-clip: text; color: transparent;
  font-weight: 560;
}
/* the gradient word must stay readable: a solid colour where text clipping is unsupported */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) { .brand-live { color: var(--primary); } }
.areas { display: flex; gap: var(--space-1); padding: var(--space-1); border-radius: var(--radius-full); background: var(--surface-dim); }
.topbar-end { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; justify-content: flex-end; }
.viewer { font: var(--type-body-s); color: var(--on-surface-soft); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode-chip { font: var(--type-label-s); }
/* the phone's one theme button: shows the current choice's icon (hidden on a wide screen, where the three show) */
.btn.theme-cycle { display: none; }
.theme-cycle svg { width: 20px; height: 20px; display: none; }
.theme-cycle[data-choice="device"] .tc-device, .theme-cycle[data-choice="light"] .tc-light, .theme-cycle[data-choice="dark"] .tc-dark { display: block; }

/* ================= Buttons ================= */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--control-h); padding: 0 var(--space-4); border: 0; border-radius: var(--radius-full);
  font: var(--type-button); cursor: pointer; text-decoration: none; white-space: nowrap;
  background: var(--surface-dim); color: var(--on-surface-strong);
  transition: box-shadow 280ms var(--ease-legacy), transform var(--dur-2) var(--ease-standard), background-color var(--dur-2) var(--ease-standard);
  -webkit-tap-highlight-color: transparent;
}
.btn::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: currentColor; opacity: 0; transition: opacity var(--dur-2) var(--ease-standard);
}
.btn:hover::before { opacity: var(--state-hover); }
.btn:active::before { opacity: var(--state-pressed); }
.btn:active { transform: scale(0.98); }
.btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.btn[disabled], .btn[aria-disabled="true"] {
  cursor: not-allowed; box-shadow: none; transform: none;
  color: color-mix(in srgb, var(--on-surface) 50%, transparent);
  background: color-mix(in srgb, var(--on-surface) 10%, transparent);
}
.btn[disabled]::before, .btn[aria-disabled="true"]::before { opacity: 0 !important; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn--sm { min-height: var(--control-h-sm); padding: 0 var(--space-3); font: var(--type-label-s); }
.btn--wrap { white-space: normal; text-align: left; padding-top: 6px; padding-bottom: 6px; max-width: 100%; }
.btn--lg { min-height: var(--control-h-lg); padding: 0 var(--space-6); }
/* the main buttons: solid primary (readable), a gradient edge and a soft gradient glow outside */
.btn--primary {
  color: var(--on-primary);
  background: linear-gradient(var(--primary), var(--primary)) padding-box, var(--gradient-ring) border-box;
  border: 2px solid transparent;
  box-shadow: var(--glow-shadow-soft);
}
.btn--primary:hover { box-shadow: var(--glow-shadow); }
.btn--tonal { background: var(--selected); color: var(--on-selected); }
.btn--outlined { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
.btn--text { background: transparent; color: var(--primary); padding: 0 var(--space-3); }
.btn--icon { padding: 0; width: var(--control-h); min-width: var(--control-h); }
.btn--danger { background: var(--negative-container); color: var(--negative); }
.ico { width: 18px; height: 18px; flex: none; }
.icon-inline { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; }
.banner > .ico { width: 20px; height: 20px; margin-top: 1px; }

/* segmented controls (area tabs, theme, map switches) */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-full); background: var(--surface-dim); flex-wrap: wrap; }
.seg-btn {
  position: relative; border: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer;
  min-height: var(--control-h-sm); padding: 0 var(--space-3); border-radius: var(--radius-full); font: var(--type-label-s);
  transition: background-color var(--dur-2) var(--ease-standard), color var(--dur-2) var(--ease-standard);
}
.seg-btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity var(--dur-2) var(--ease-standard); pointer-events: none; }
.seg-btn:hover::before { opacity: var(--state-hover); }
.seg-btn:active::before { opacity: var(--state-pressed); }
.seg-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 1px; }
.seg-btn[aria-pressed="true"], .seg-btn[aria-selected="true"], .seg-btn[aria-checked="true"] {
  background: var(--surface-bright); color: var(--on-surface-strong); box-shadow: var(--shadow-card), 0 0 0 1px var(--hairline);
}
.areas .seg-btn { min-height: var(--control-h); padding: 0 var(--space-4); font: var(--type-button); }

/* chips */
.chip {
  position: relative; display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--control-h-sm);
  padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--outline-variant);
  background: transparent; color: var(--on-surface-variant); font: var(--type-label-s); cursor: pointer; text-align: left;
}
.chip::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity var(--dur-2) var(--ease-standard); pointer-events: none; }
.chip:hover::before { opacity: var(--state-hover); }
.chip:active::before { opacity: var(--state-pressed); }
.chip:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.chip[aria-pressed="true"], .chip[aria-expanded="true"] { background: var(--selected); color: var(--on-selected); border-color: transparent; }
.chip .count { font-variant-numeric: tabular-nums; color: inherit; opacity: 0.85; }
.chip--q { border-radius: var(--radius-full); padding: var(--space-1) var(--space-4); min-height: var(--control-h); white-space: normal; }
.chip--warn { border-color: var(--warning-edge); color: var(--warning); background: var(--warning-container); }

/* pills (non-interactive labels) */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--radius-full);
  font: var(--type-label-s); white-space: nowrap; background: var(--surface-container-high); color: var(--on-surface-variant);
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.lv-critical { background: var(--lv-critical-bg); color: var(--lv-critical-fg); }
.lv-high { background: var(--lv-high-bg); color: var(--lv-high-fg); }
.lv-medium { background: var(--lv-medium-bg); color: var(--lv-medium-fg); }
.lv-low { background: var(--lv-low-bg); color: var(--lv-low-fg); }
.lv-unknown { background: var(--lv-unknown-bg); color: var(--lv-unknown-fg); }
.st-good { background: var(--positive-container); color: var(--positive); }
.st-warn { background: var(--warning-container); color: var(--warning); }
.st-bad { background: var(--negative-container); color: var(--negative); }
.st-info { background: var(--info-container); color: var(--info); }
.st-plain { background: var(--surface-container-high); color: var(--on-surface-variant); }

/* ================= Banners and notices ================= */
.banners { display: grid; gap: var(--space-3); margin: var(--space-4) 0 0; }
.banner {
  display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg); border: 1px solid var(--warning-edge); background: var(--warning-container); color: var(--warning);
}
.banner strong { font-weight: 600; }
.banner code.cmd { user-select: all; }
.banner code { font-family: var(--font-mono); font-size: 0.8125rem; padding: 1px 6px; border-radius: var(--radius-xs); background: color-mix(in srgb, currentColor 12%, transparent); overflow-wrap: anywhere; }
.banner--bad { border-color: color-mix(in srgb, var(--negative) 40%, transparent); background: var(--negative-container); color: var(--negative); }
.banner--info { border-color: color-mix(in srgb, var(--info) 30%, transparent); background: var(--info-container); color: var(--info); }
.banner .btn { margin-left: auto; flex: none; }
.banner-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.notice { padding: var(--space-6); border-radius: var(--radius-xl); text-align: left; }
.notice h2 { font: var(--type-headline-m); margin-bottom: var(--space-2); }
.notice p + p { margin-top: var(--space-2); }
.toast {
  position: fixed; left: 50%; bottom: var(--space-6); transform: translateX(-50%); z-index: 60;
  max-width: min(560px, calc(100vw - 32px)); padding: var(--space-3) var(--space-5); border-radius: var(--radius-lg);
  background: var(--on-surface); color: var(--surface); box-shadow: var(--shadow-2); font: var(--type-body-m);
}

/* ================= Sections ================= */
.section { margin-top: var(--space-7); }
.section-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-3); }
.section-title { font: var(--type-headline-s); font-variation-settings: "ROND" 20; }
.section-note { font: var(--type-body-s); color: var(--on-surface-soft); }
.overline { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-surface-soft); }

/* ================= Now strip ================= */
.now { margin-top: var(--space-5); padding: var(--space-6) var(--space-7); border-radius: var(--radius-2xl); }
.now-top { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.now-level { font: 560 1rem/1.5rem var(--font-sans); padding: 4px 14px; }
.now-level .dot { width: 10px; height: 10px; }
.fresh { margin-left: auto; font: var(--type-body-s); color: var(--on-surface-soft); }
.now-headline { margin-top: var(--space-3); font: var(--type-headline-m); font-variation-settings: "ROND" 20; max-width: 72ch; overflow-wrap: anywhere; }
.counts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin-top: var(--space-4); }
.count-item { display: flex; align-items: baseline; gap: var(--space-2); }
.count-num { font: 500 1.375rem/1.75rem var(--font-sans); font-variant-numeric: tabular-nums; }
.count-label { font: var(--type-body-s); color: var(--on-surface-soft); }
.cansee { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-4); }
.cansee-label { font: var(--type-label-s); color: var(--on-surface-variant); margin-right: var(--space-1); }
/* the phone's one button for the "can't see" chips (a wide screen shows the chips themselves) */
.cansee-toggle { display: none; }
.cansee-toggle[aria-expanded="true"] .icon-inline:last-child { transform: rotate(180deg); }
/* the first thing to do, inside the Now strip: shown where the "Look here first" cards stack (see Responsive) */
.now-start {
  display: none; margin-top: var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--surface-bright); border: 1px solid var(--hairline);
}
.now-start.needs { border: 2px solid transparent; background: linear-gradient(var(--surface-bright), var(--surface-bright)) padding-box, var(--gradient-ring) border-box; }
.now-start-label { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--primary); }
.now-start-title { margin-top: var(--space-1); font: 500 1.0625rem/1.5rem var(--font-sans); overflow-wrap: anywhere; }
.now-start-next { margin-top: var(--space-1); font: var(--type-body-s); color: var(--on-surface-variant); overflow-wrap: anywhere; }
.now-start .btn { margin-top: var(--space-3); }
.explain {
  margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
  background: var(--surface-container-low); border: 1px solid var(--hairline); max-width: 760px;
}
.explain p + p { margin-top: var(--space-1); }
.sources { margin-top: var(--space-4); }
.sources-list { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; gap: var(--space-2); }
.source-row { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3); align-items: start; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-container-low); }
.source-row .when { font: var(--type-body-s); color: var(--on-surface-soft); white-space: nowrap; }
.disclosure { display: inline-flex; align-items: center; gap: var(--space-2); }
.disclosure svg { transition: transform var(--dur-3) var(--ease-standard); }
.disclosure[aria-expanded="true"] svg { transform: rotate(180deg); }

/* ================= Look here first / Then ================= */
.first-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.item-card {
  display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-5); border-radius: var(--radius-xl);
  background: var(--glass-strong); border: 1px solid var(--hairline); box-shadow: var(--shadow-card);
  transition: box-shadow var(--dur-3) var(--ease-standard), border-color var(--dur-3) var(--ease-standard);
}
.item-card:hover { box-shadow: var(--shadow-card-hover); }
.item-card.glow:hover { box-shadow: var(--glow-shadow); }
.item-head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.rank {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex: none;
  font: 600 0.8125rem/1 var(--font-sans); background: var(--on-surface); color: var(--surface);
}
.item-title { font: var(--type-title-m); font-size: 1.0625rem; line-height: 1.5rem; overflow-wrap: anywhere; }
.item-why { color: var(--on-surface-variant); overflow-wrap: anywhere; }
.item-next { font: var(--type-body-s); color: var(--on-surface-variant); overflow-wrap: anywhere; }
.item-next b { color: var(--on-surface); font-weight: 600; }
.item-actions { margin-top: auto; padding-top: var(--space-2); display: flex; flex-wrap: wrap; gap: var(--space-2); }
.then-list { list-style: none; margin: 0; padding: 0; border-radius: var(--radius-xl); overflow: hidden; }
.then-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: center;
  padding: var(--space-3) var(--space-5); border-top: 1px solid var(--hairline);
}
.then-row:first-child { border-top: 0; }
.then-text { min-width: 0; }
.then-title { font: var(--type-body-m-strong); overflow-wrap: anywhere; }
.then-why { font: var(--type-body-s); color: var(--on-surface-soft); overflow-wrap: anywhere; }

/* ================= Questions ================= */
.questions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.answer { margin-top: var(--space-4); padding: var(--space-5) var(--space-6); border-radius: var(--radius-xl); }
.answer-q { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-surface-soft); }
.answer-a { margin-top: var(--space-2); font: var(--type-body-l); overflow-wrap: anywhere; max-width: 80ch; }
.answer-actions { margin-top: var(--space-4); display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ================= View tabs ================= */
.views-panel { border-radius: var(--radius-2xl); padding: var(--space-4) var(--space-6) var(--space-6); }
.tabs {
  display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--space-2) * -1);
  padding: var(--space-1) var(--space-2) var(--space-2); border-bottom: 1px solid var(--hairline);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: none; border: 0; background: transparent; cursor: pointer; color: var(--on-surface-variant);
  min-height: var(--control-h); padding: 0 var(--space-4); border-radius: var(--radius-md); font: var(--type-button);
}
.tab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity var(--dur-2) var(--ease-standard); pointer-events: none; }
.tab:hover::before { opacity: var(--state-hover); }
.tab:active::before { opacity: var(--state-pressed); }
.tab:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: -3px; }
.tab[aria-selected="true"] { color: var(--on-surface-strong); background: var(--row-active); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -9px; height: 3px; border-radius: 3px 3px 0 0;
  background: var(--gradient-gemini-blue);
}
.tab .count { margin-left: 6px; font-variant-numeric: tabular-nums; color: var(--on-surface-soft); }
.view { padding-top: var(--space-4); }
.view-lead { color: var(--on-surface-variant); max-width: 90ch; }
.view-lead b { color: var(--on-surface); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); align-items: center; margin-top: var(--space-4); }
.toolbar-group { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.toolbar-label { font: var(--type-label-s); color: var(--on-surface-soft); }
.filter-note {
  display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-3);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--info-container); color: var(--info);
}
.empty {
  margin-top: var(--space-4); padding: var(--space-6); border-radius: var(--radius-lg); border: 1px dashed var(--outline-variant);
  background: var(--surface-container-low);
}
.empty h3 { font: var(--type-title-m); margin-bottom: var(--space-1); }
.empty p + p { margin-top: var(--space-1); }
.empty .btn { margin-top: var(--space-3); }

/* fields */
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field > span, .field-label { font: var(--type-label-s); color: var(--on-surface-variant); }
.input, .select, .textarea {
  min-height: var(--control-h); padding: 0 var(--space-3); border-radius: var(--radius-sm);
  border: 1px solid var(--outline-variant); background: var(--surface-bright); color: var(--on-surface);
  transition: border-color var(--dur-2) var(--ease-standard), box-shadow var(--dur-2) var(--ease-standard);
  max-width: 100%;
}
.textarea { padding: var(--space-2) var(--space-3); min-height: 84px; resize: vertical; width: 100%; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--outline); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 1px; border-color: var(--primary); }
.search { position: relative; flex: 1 1 260px; min-width: 0; max-width: 420px; }
.search .input { width: 100%; padding-left: 36px; border-radius: var(--radius-full); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--on-surface-soft); pointer-events: none; }
.check { display: inline-flex; align-items: flex-start; gap: var(--space-2); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.check input:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

/* ================= Story map ================= */
.map-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--space-5); margin-top: var(--space-4); align-items: start; }
.map-box { position: relative; border-radius: var(--radius-xl); background: var(--surface-container-low); border: 1px solid var(--hairline); overflow: hidden; min-height: 280px; }
.map-box svg { display: block; width: 100%; height: auto; }
.map-topic { fill: color-mix(in srgb, var(--surface-container-high) 55%, transparent); stroke: var(--outline-variant); stroke-width: 1; }
.map-topic-label { font: 500 12px/1 var(--font-sans); fill: var(--on-surface-variant); paint-order: stroke; stroke: var(--surface-container-low); stroke-width: 4px; stroke-linejoin: round; }
.map-node { cursor: pointer; }
.map-node circle.body { stroke: var(--surface-bright); stroke-width: 1.5; transition: opacity var(--dur-3) var(--ease-standard); }
.map-node:hover circle.body { stroke: var(--on-surface); stroke-width: 2; }
.map-node.dim { opacity: 0.18; }
.map-node.focus circle.body { stroke: var(--on-surface); stroke-width: 3; }
.map-node.dashed circle.body { stroke-dasharray: 3 3; stroke: var(--on-surface-variant); }
.map-ring { fill: none; transform-box: fill-box; transform-origin: center; }
.map-ring.spd-surging { stroke-width: 3; animation: ring-pulse 1.1s var(--ease-standard) infinite; }
.map-ring.spd-rising { stroke-width: 2.5; animation: ring-pulse 2.4s var(--ease-standard) infinite; }
.map-ring.spd-steady { stroke-width: 1.25; opacity: 0.55; }
.map-ring.spd-slowing { stroke-width: 1.25; stroke-dasharray: 4 3; opacity: 0.6; }
.map-ring.spd-unknown { stroke-width: 1; stroke-dasharray: 1 3; opacity: 0.6; }
@keyframes ring-pulse {
  0% { transform: scale(1); opacity: 0.85; }
  70% { transform: scale(1.22); opacity: 0; }
  100% { transform: scale(1.22); opacity: 0; }
}
.map-mark-glow { fill: none; stroke: url(#dashRingGrad); stroke-width: 5; filter: url(#dashGlowBlur); }
.map-mark-ring { fill: none; stroke: url(#dashRingGrad); stroke-width: 2.5; }
.map-badge circle { fill: var(--on-surface); }
.map-badge text { fill: var(--surface); font: 700 12px/1 var(--font-sans); }
.map-label { font: 500 11px/1 var(--font-sans); fill: #ffffff; pointer-events: none; paint-order: stroke; stroke: rgba(0, 0, 0, 0.55); stroke-width: 3px; stroke-linejoin: round; }
.map-tip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 280px; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md); background: var(--glass-strong); border: 1px solid var(--hairline); box-shadow: var(--shadow-2);
  -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); font: var(--type-body-s);
}
.map-tip b { display: block; font: var(--type-body-m-strong); margin-bottom: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-3); font: var(--type-body-s); color: var(--on-surface-variant); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend-ring { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.legend-num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--on-surface); color: var(--surface); font: 700 11px/1 var(--font-sans); box-shadow: var(--glow-shadow-soft); }
.legend-notes { margin-top: var(--space-2); font: var(--type-body-s); color: var(--on-surface-soft); }
.story-list { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; border-radius: var(--radius-xl); border: 1px solid var(--hairline); background: var(--surface-bright); }
.story-row {
  position: relative; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3); align-items: start;
  padding: var(--space-3) var(--space-4); border: 0; border-top: 1px solid var(--hairline); background: transparent; text-align: left; cursor: pointer;
}
.story-list li:first-child .story-row { border-top: 0; }
.story-row::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity var(--dur-2) var(--ease-standard); pointer-events: none; }
.story-row:hover::before { opacity: 0.05; }
.story-row:active::before { opacity: var(--state-pressed); }
.story-row:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: -3px; }
.story-row.focus { background: var(--primary-container); }
.story-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; }
.story-title { font: var(--type-body-m-strong); overflow-wrap: anywhere; }
.story-meta { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); margin-top: var(--space-1); font: var(--type-body-s); color: var(--on-surface-soft); align-items: center; }
.story-row .rank { width: 22px; height: 22px; font-size: 0.75rem; box-shadow: var(--glow-shadow-soft); }

/* ================= Tables (alerts, pressure) ================= */
.table-wrap { margin-top: var(--space-4); border-radius: var(--radius-xl); border: 1px solid var(--hairline); background: var(--surface-bright); overflow: hidden; }
.table { width: 100%; border-collapse: collapse; table-layout: auto; }
.table th {
  text-align: left; font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-surface-soft);
  padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--hairline); background: var(--surface-container-low); white-space: nowrap;
}
.table td { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--hairline); vertical-align: top; overflow-wrap: anywhere; }
.table tr:first-child td { border-top: 0; }
.table tbody tr { transition: background-color var(--dur-2) var(--ease-standard); }
.table tbody tr:hover { background: var(--row-hover); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.th-sort { border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; align-items: center; gap: 4px; }
.th-sort:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-xs); }
.row-open { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; color: var(--on-surface); font: var(--type-body-m-strong); overflow-wrap: anywhere; }
.row-open:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
.row-open:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-xs); }
.sub { display: block; font: var(--type-body-s); color: var(--on-surface-soft); margin-top: 2px; }
.alert-cards { display: none; list-style: none; margin: var(--space-4) 0 0; padding: 0; gap: var(--space-3); }
.alert-card { padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-bright); border: 1px solid var(--hairline); display: grid; gap: var(--space-2); }
.alert-card .meta { display: flex; flex-wrap: wrap; gap: var(--space-2); font: var(--type-body-s); color: var(--on-surface-soft); }
.list-foot { margin-top: var(--space-3); font: var(--type-body-s); color: var(--on-surface-soft); }
.change-up { color: var(--lv-high-fg); font-weight: 600; }
.change-down { color: var(--info); font-weight: 600; }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--chart-1); vertical-align: middle; margin-right: 6px; min-width: 2px; }

/* ================= Pressure, pipeline, early, held ================= */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
.card { padding: var(--space-5); border-radius: var(--radius-xl); background: var(--surface-bright); border: 1px solid var(--hairline); box-shadow: var(--shadow-card); min-width: 0; }
.card h3 { font: var(--type-title-m); margin-bottom: var(--space-2); }
.card > .table-wrap { border: 0; border-radius: 0; background: transparent; margin: 0 calc(var(--space-5) * -1) calc(var(--space-5) * -1); border-top: 1px solid var(--hairline); }
.card > .table-wrap th { background: transparent; }
.card:has(> .table-wrap) { overflow: hidden; }
.card .big { font: var(--type-numeric); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); margin: 0; }
.kv dt { color: var(--on-surface-soft); font: var(--type-body-s); padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.plain-list { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: grid; gap: var(--space-2); }
.plain-list li { overflow-wrap: anywhere; }
.stages { display: flex; align-items: stretch; gap: var(--space-2); margin-top: var(--space-4); overflow: hidden; flex-wrap: wrap; }
.stage { flex: 1 1 130px; min-width: 0; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-bright); border: 1px solid var(--hairline); position: relative; }
.stage-count { font: var(--type-numeric); font-variant-numeric: tabular-nums; }
.stage-label { font: var(--type-body-m-strong); margin-top: var(--space-1); }
.stage-note { font: var(--type-body-s); color: var(--on-surface-soft); margin-top: var(--space-1); }
.stage-arrow { align-self: center; color: var(--on-surface-soft); flex: none; }
.stuck-list { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; gap: var(--space-3); }
.stuck-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-bright); border: 1px solid var(--hairline); }
.flash { animation: flash 1.6s var(--ease-standard) 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(49, 134, 255, 0.55); } 100% { box-shadow: 0 0 0 14px rgba(49, 134, 255, 0); } }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 48px; margin-top: var(--space-2); }
.spark span { flex: 1 1 0; min-width: 3px; border-radius: 2px 2px 0 0; background: var(--chart-1); }
.spark span.none { background: repeating-linear-gradient(45deg, var(--outline-variant) 0 2px, transparent 2px 4px); height: 100% !important; opacity: 0.6; }

/* ================= Drawer and dialogs ================= */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity var(--dur-4) var(--ease-standard); }
.scrim.on { opacity: 1; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(600px, 100vw); display: flex; flex-direction: column;
  border-radius: var(--radius-2xl) 0 0 var(--radius-2xl); box-shadow: var(--shadow-drawer);
  background: var(--glass-strong); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass);
  border-left: 1px solid var(--hairline);
  transform: translateX(104%); transition: transform var(--dur-4) var(--ease-out-quint);
}
.drawer.on { transform: translateX(0); }
.drawer-head { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-5) var(--space-6) var(--space-4); border-bottom: 1px solid var(--hairline); }
.drawer-head h2 { font: var(--type-headline-s); overflow-wrap: anywhere; }
.drawer-head .pills { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.drawer-head .btns { margin-left: auto; display: flex; gap: var(--space-1); flex: none; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; padding: var(--space-5) var(--space-6) var(--space-10); overscroll-behavior: contain; }
.d-section { margin-top: var(--space-6); }
.d-section:first-child { margin-top: 0; }
.d-section > h3 { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-surface-soft); margin-bottom: var(--space-2); }
.todo { padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); background: var(--surface-bright); }
.todo-label { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--primary); }
.todo-text { margin-top: var(--space-1); font: var(--type-body-l); overflow-wrap: anywhere; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); counter-reset: feed; }
.feed-item { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-bright); border: 1px solid var(--hairline); min-width: 0; }
.feed-head { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; font: var(--type-body-s); color: var(--on-surface-soft); }
.feed-text { margin-top: var(--space-1); overflow-wrap: anywhere; white-space: pre-line; }
.feed-links { margin-top: var(--space-1); display: flex; flex-wrap: wrap; gap: var(--space-3); font: var(--type-label-s); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 var(--space-4); border-left: 2px solid var(--outline-variant); display: grid; gap: var(--space-3); }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: calc(-1 * var(--space-4) - 6px); top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.corr { width: 100%; border-collapse: collapse; font: var(--type-body-s); }
.corr th { text-align: left; color: var(--on-surface-soft); font-weight: 500; padding: var(--space-1) var(--space-2) var(--space-1) 0; }
.corr td { padding: var(--space-2) var(--space-2) var(--space-2) 0; border-top: 1px solid var(--hairline); vertical-align: top; overflow-wrap: anywhere; }
.old { text-decoration: line-through; color: var(--on-surface-soft); }
.dialog {
  position: fixed; z-index: 51; left: 50%; top: 10vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); max-height: 80vh;
  display: flex; flex-direction: column; border-radius: var(--radius-2xl); box-shadow: var(--shadow-drawer);
  background: var(--glass-strong); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border: 1px solid var(--hairline);
}
.dialog-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6) var(--space-3); }
.dialog-head h2 { font: var(--type-headline-s); }
.dialog-head .btn { margin-left: auto; }
.dialog-body { padding: 0 var(--space-6) var(--space-6); overflow-y: auto; }
.form-row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: flex-end; }
.form-row .field { flex: 1 1 260px; }
.scrim.dialog-scrim { z-index: 50; }

/* ================= Skeleton ================= */
.skel { position: relative; overflow: hidden; background: var(--skeleton); border-radius: var(--radius-md); }
.skel::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--skeleton-highlight), transparent);
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.skel-line { height: 14px; margin-top: var(--space-2); }
.skel-head { height: 30px; width: 70%; margin-top: var(--space-3); }
.skel-card { height: 168px; border-radius: var(--radius-xl); }
.loading-word { display: flex; align-items: center; gap: var(--space-3); color: var(--on-surface-variant); font: var(--type-body-l); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--outline-variant); border-top-color: var(--primary); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= Slide deliveries ================= */
.deliv-list { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; gap: var(--space-4); }
.deliv { padding: var(--space-5) var(--space-6); border-radius: var(--radius-xl); }
.deliv-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.deliv-head h3 { font: var(--type-headline-s); overflow-wrap: anywhere; }
.deliv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3) var(--space-5); margin-top: var(--space-4); }
.deliv-grid dt { font: var(--type-overline); letter-spacing: 0.4px; text-transform: uppercase; color: var(--on-surface-soft); }
.deliv-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.deliv-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-4); align-items: center; }
.why-off { font: var(--type-body-s); color: var(--warning); }
.editor { margin-top: var(--space-4); padding: var(--space-6); border-radius: var(--radius-2xl); }
.editor-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.editor-head h2 { font: var(--type-headline-m); }
.steps { list-style: none; margin: var(--space-5) 0 0; padding: 0; display: grid; gap: var(--space-4); counter-reset: step; }
.step { position: relative; padding: var(--space-5) var(--space-5) var(--space-5) 64px; border-radius: var(--radius-xl); background: var(--surface-bright); border: 1px solid var(--hairline); min-width: 0; }
.step::before {
  counter-increment: step; content: counter(step); position: absolute; left: var(--space-5); top: var(--space-5);
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-container-high); color: var(--on-surface); font: 600 0.875rem/1 var(--font-sans);
}
.step.done::before { background: var(--primary); color: var(--on-primary); }
.step.locked { opacity: 0.6; }
.step h3 { font: var(--type-title-m); font-size: 1.0625rem; }
.step-help { margin-top: var(--space-1); font: var(--type-body-s); color: var(--on-surface-soft); max-width: 80ch; }
.step-body { margin-top: var(--space-3); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); min-width: 0; }
.slides-pick { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.slide-item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-container-low); }
.slide-num { font: 600 0.875rem/1.5rem var(--font-sans); color: var(--on-surface-soft); text-align: right; font-variant-numeric: tabular-nums; }
.slide-title { font: var(--type-body-m-strong); overflow-wrap: anywhere; }
.slide-text { font: var(--type-body-s); color: var(--on-surface-soft); overflow-wrap: anywhere; }
.gap-btn {
  position: relative; display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: 30px; margin: 2px 0; padding: 0 var(--space-3);
  border: 1px dashed transparent; border-radius: var(--radius-md); background: transparent; color: var(--on-surface-soft); cursor: pointer; font: var(--type-label-s); text-align: left;
}
.gap-btn::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--outline-variant); opacity: 0.7; }
.gap-btn:hover { border-color: var(--outline); color: var(--primary); }
.gap-btn:active { background: var(--row-active); }
.gap-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 1px; }
.gap-btn[aria-pressed="true"] {
  border: 2px solid transparent; color: var(--on-primary-container); min-height: 40px;
  background: linear-gradient(var(--primary-container), var(--primary-container)) padding-box, var(--gradient-ring) border-box;
  box-shadow: var(--glow-shadow-soft); font: var(--type-button);
}
.gap-btn[aria-pressed="true"]::after { display: none; }
.daychips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.range { width: 100%; max-width: 520px; accent-color: var(--primary); }
.range:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 4px; border-radius: var(--radius-sm); }
.range-label { font: var(--type-body-l); }
.coverage { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-container-low); border: 1px solid var(--hairline); }
.coverage.warn { background: var(--warning-container); color: var(--warning); border-color: var(--warning-edge); }
.coverage ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); }
.inline-fields { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; min-width: 0; }
.inline-fields > .field { flex: 0 1 auto; min-width: 0; max-width: 100%; }
.inline-fields .select { width: 100%; }
.unavailable { color: var(--on-surface-soft); }
.unavailable .why { display: block; font: var(--type-body-s); color: var(--warning); margin-top: 2px; }
.share-with { font-family: var(--font-mono); font-size: 0.875rem; padding: 2px 8px; border-radius: var(--radius-xs); background: color-mix(in srgb, currentColor 10%, transparent); user-select: all; overflow-wrap: anywhere; }
.save-bar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-5); }
/* the preview: a 16:9 slide drawn with the deck's own design values (sizes in points: 720 points across) */
.slide-scroll { max-width: 100%; overflow-x: auto; border-radius: var(--radius-md); }
.slide-scroll:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.slide-wrap { container-type: inline-size; width: 100%; max-width: 880px; }
.slide-card {
  --pt: calc(100cqw / 720);
  position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: var(--radius-md);
  border: 1px solid var(--hairline-strong); box-shadow: var(--shadow-card-hover); background: #ffffff; color: #1f1f1f;
  padding: calc(28 * var(--pt)) calc(36 * var(--pt)); display: flex; flex-direction: column; gap: calc(8 * var(--pt));
  font-size: calc(12 * var(--pt)); line-height: 1.3;
}
.slide-card.plain { font-family: var(--font-sans); }
.slide-title-txt { font-weight: 400; line-height: 1.15; }
/* the card grows with text taller than the slide (never cut off unseen): a dashed line shows where the slide ends */
.slide-end { display: none; position: absolute; left: 0; right: 0; top: calc(405 * var(--pt)); border-top: 2px dashed #b3261e; pointer-events: none; }
.slide-card.over .slide-end { display: block; }
.slide-end span { position: absolute; right: calc(8 * var(--pt)); top: 4px; padding: 1px 8px; border-radius: var(--radius-xs); background: #b3261e; color: #ffffff;
  font: 500 0.75rem/1.4 var(--font-sans); letter-spacing: 0; }
/* the slide as it lands: the page at its own size (--pw x --ph points), the title and body in the deck's own boxes */
.slide-card--deck { --pt: calc(100cqw / var(--pw, 720)); padding: 0; display: block; aspect-ratio: auto; height: calc(var(--ph, 405) * var(--pt)); }
.slide-card--deck .slide-end { top: calc(var(--ph, 405) * var(--pt)); }
.slide-box { position: absolute; padding: calc(7.2 * var(--pt)); overflow-wrap: anywhere; white-space: pre-wrap; }
.slide-box--title { display: flex; align-items: flex-end; line-height: 1.15; }
.slide-box--title > div { width: 100%; }
.slide-box--body { line-height: 1.3; }
.slide-box a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.slide-window { opacity: 0.8; }
.slide-issues { display: flex; flex-direction: column; gap: calc(10 * var(--pt)); min-height: 0; }
.slide-issue-name { font-weight: 700; }
.slide-tag { display: inline-block; margin-left: calc(6 * var(--pt)); padding: 0 calc(5 * var(--pt)); border: 1px solid currentColor; border-radius: calc(3 * var(--pt)); font-weight: 500; font-size: 0.8em; opacity: 0.85; }
.slide-issue a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.slide-status { opacity: 0.8; }
.slide-empty { opacity: 0.8; }
.preview-note { font: var(--type-body-s); color: var(--on-surface-soft); }

/* sections scrolled to stop below the sticky header */
.section, .now, .views-panel, .step, .editor, #slides-root { scroll-margin-top: 88px; }

/* ================= Responsive ================= */
@media (max-width: 1100px) {
  .map-layout { grid-template-columns: minmax(0, 1fr); }
  .story-list { max-height: none; }
  .deliv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .first-grid { grid-template-columns: minmax(0, 1fr); }
  /* the cards stack below the fold: the Now strip says the first thing to do itself */
  .now-start { display: block; }
  .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .wrap { padding: 0 var(--space-4) var(--space-10); }
  /* on a phone the header scrolls away with the page, in two rows: the name, the mode and Refresh; the areas and the
     one theme button */
  .topbar { position: relative; }
  .topbar-in { padding: var(--space-2) var(--space-4); gap: var(--space-2); }
  .brand { order: 1; flex: 1 1 auto; gap: var(--space-2); }
  .topbar-end { order: 2; gap: var(--space-2); flex-wrap: nowrap; }
  .topbar-in::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
  .areas { order: 4; flex: 1 1 0; min-width: 0; }
  .btn.theme-cycle { order: 5; display: inline-flex; flex: none; }
  .brand-name { font-size: 1.0625rem; }
  .areas .seg-btn { flex: 1 1 0; padding: 0 var(--space-2); }
  .theme-seg, .viewer { display: none; }
  .mode-word { display: none; }
  #refresh-btn { width: var(--control-h); padding: 0; }
  #refresh-btn .btn-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  /* the "can't see" chips fold behind one button */
  .cansee-toggle { display: inline-flex; }
  .cansee-label { display: none; }
  .cansee:not(.open) > .chip:not(.cansee-toggle) { display: none; }
  .now { padding: var(--space-5) var(--space-4); border-radius: var(--radius-xl); }
  .now-headline { font: 400 1.25rem/1.625rem var(--font-sans); }
  .fresh { margin-left: 0; width: 100%; }
  .views-panel { padding: var(--space-3) var(--space-4) var(--space-5); border-radius: var(--radius-xl); }
  .panel { padding: var(--space-4); }
  .then-row { grid-template-columns: minmax(0, 1fr); padding: var(--space-3) var(--space-4); }
  .then-row .btn { justify-self: start; }
  .table-alerts { display: none; }
  .alert-cards { display: grid; }
  .table-stack thead { display: none; }
  .table-stack, .table-stack tbody, .table-stack tr, .table-stack td { display: block; width: 100%; }
  .table-stack tr { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--hairline); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px var(--space-3); }
  .table-stack td:first-child { grid-column: 1 / -1; font-weight: 600; margin-bottom: 2px; }
  .table-stack tr:first-child { border-top: 0; }
  .table-stack td { border: 0; padding: 2px 0; text-align: left !important; }
  .table-stack td[data-label]::before { content: attr(data-label) ": "; color: var(--on-surface-soft); font: var(--type-body-s); }
  /* the corrections stack on a phone: the field, then was / now / why, each named (no word cut in a narrow column) */
  .corr thead { display: none; }
  .corr, .corr tbody, .corr tr, .corr td { display: block; width: 100%; }
  .corr tr { border-top: 1px solid var(--hairline); padding: var(--space-2) 0; }
  .corr td { border: 0; padding: 1px 0; overflow-wrap: break-word; }
  .corr td:first-child { font-weight: 600; text-transform: capitalize; }
  .corr td[data-label]::before { content: attr(data-label) ": "; color: var(--on-surface-soft); text-decoration: none; display: inline-block; margin-right: 4px; }
  .stage-arrow { display: none; }
  .stage { flex: 1 1 140px; }
  .stuck-item { grid-template-columns: minmax(0, 1fr); }
  .drawer { width: 100vw; border-radius: 0; border-left: 0; }
  .drawer-head { padding: var(--space-4); }
  .drawer-body { padding: var(--space-4) var(--space-4) var(--space-10); }
  .dialog { top: 0; left: 0; transform: none; width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
  .deliv { padding: var(--space-4); }
